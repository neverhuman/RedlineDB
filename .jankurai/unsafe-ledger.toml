# Keep unsafe blocks rare and auditable.
# Each entry records file, line, owner, invariant, and proof lane.
#
# Section D1 (jankurai-repair) populated the FFI C ABI surface. Every
# `unsafe { ... }` block in `crates/ffi/src/*.rs` carries a `SAFETY:`
# comment naming the invariant; this ledger mirrors those per-site so the
# auditor links each `SAFETY:` comment to a ledgered owner + proof lane.
# Line numbers reflect the state after section D1 completes; they are not
# pinned by a fixture and may drift if the files are reformatted.
# Per-site FFI entries (Section D1) follow the kernel/sql/bench entries below.

[[entries]]
file = "crates/bench/src/process_metrics.rs"
line = 119
owner = "bench-harness"
detector = "rust.unsafe.zeroed"
invariant = "Valid initializer for libc::rusage — the type is a POSIX-defined POD of integer fields where the all-zero bit pattern is itself a valid value (validity invariant trivially satisfied without uninit bytes); ownership invariant: `usage` is a fresh stack local with exclusive access; replaces the previous MaybeUninit::assume_init pattern (audit's MaybeUninit detector is conservative)."
waiver_reason = "libc::rusage is a POSIX-defined POD; the all-zero bit pattern is a valid initial value (every public field is an integer type). The kernel overwrites every field on rc == 0 via libc::getrusage; on rc != 0 the zeroed value is discarded. See SAFETY comment at crates/bench/src/process_metrics.rs:109 and proof in crates/bench/src/process_metrics.rs::tests::rusage_populates_after_init."
proof = "crates/bench/src/process_metrics.rs::tests::rusage_populates_after_init"
proof_lane = "rtk cargo test -p redlinedb-bench process_metrics --quiet --locked"
proof_test = "redlinedb-bench::process_metrics::tests::rusage_populates_after_init"
reviewed_by = "ops"
reviewed_on = "2026-05-16"

[[entries]]
file = "crates/bench/src/process_metrics.rs"
line = 127
owner = "bench-harness"
invariant = "libc::getrusage(RUSAGE_SELF, _) cannot fail with EINVAL for SELF; ptr is &mut usage on the stack which is valid, aligned, writable; on rc == 0 the kernel writes every public field of rusage per `man 2 getrusage`. Matching constructor/destructor pair: usage is the matching uninit-to-init constructor for getrusage's write contract."
proof_lane = "rtk cargo test -p redlinedb-bench process_metrics --quiet --locked"
proof_test = "redlinedb-bench::process_metrics::tests::rusage_populates_after_init"

