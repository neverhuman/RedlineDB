schema_version = "1.0.0"

# Bench / certification budgets and kill-switches.
# Audit reference: HLT-026 cost-budget-gap.
# Companion policy file: .jankurai/audit-policy.toml (audit gating + scan excludes).
# Kill-switch env var: REDLINEDB_BENCH_KILL=1 halts any in-flight bench loop
# at the next iteration boundary; respected by the bench harness in
# crates/bench/src/lib.rs.
#
# Schema layout:
#   [global]          — cross-cutting controls (kill-switch env var name).
#   [bench]           — aggregate CI bench caps consumed by jankurai audit.
#   [dependencies]    — supply-chain budgets (denied crates, license allow,
#                       advisory tolerance) cross-checked against deny.toml.
#   [stop_conditions] — human-readable thresholds for bench halt + kill flow.
#   [[workload]]      — per-workload wall-clock / disk / syscall budgets.

[global]
kill_switch_env = "REDLINEDB_BENCH_KILL"

[bench]
# Aggregate caps consumed by the jankurai audit and CI bench gates.
max_wall_clock_seconds = 1800
max_ci_concurrent_jobs = 4

[dependencies]
# Supply-chain budget. Cross-checked against deny.toml during `just security`.
denied_crates = []
license_allowlist = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
max_advisory_count = 0

[stop_conditions]
# Bench halt thresholds. The kill-switch env var (REDLINEDB_BENCH_KILL=1) is
# honored at each workload iteration boundary; on hit the harness flushes
# in-flight metrics and writes a kill_receipt.json next to the run's output
# directory. Per-workload [[workload]] blocks below provide the actual caps
# the harness compares against at runtime.
bench_halt_on_kill_switch = true
bench_halt_on_wall_clock_overrun = true
bench_halt_on_disk_overrun = true
bench_halt_on_advisory_overrun = true

[[workload]]
name = "phase10-cert"
max_wall_clock_minutes = 60
max_disk_gb = 50
max_syscalls = 50_000_000
owner = "bench-harness"

[[workload]]
name = "phase10-cert-smoke"
max_wall_clock_minutes = 5
max_disk_gb = 2
max_syscalls = 5_000_000
owner = "bench-harness"

[[workload]]
name = "phase10-cert-stress"
max_wall_clock_minutes = 240
max_disk_gb = 200
max_syscalls = 500_000_000
owner = "bench-harness"

[[workload]]
name = "phase11-oltp-gap"
max_wall_clock_minutes = 30
max_disk_gb = 20
max_syscalls = 30_000_000
owner = "bench-harness"

[[workload]]
name = "dick-head-choas"
max_wall_clock_minutes = 120
max_disk_gb = 50
max_syscalls = 100_000_000
owner = "bench-harness"
