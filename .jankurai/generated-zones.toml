[[zone]]
command = "jankurai audit . --mode advisory --json .jankurai/repo-score.json --md .jankurai/repo-score.md"
path = ".jankurai/repo-score.json"
read_only = false
source = "installed jankurai binary"

[[zone]]
command = "jankurai audit . --mode advisory --json .jankurai/repo-score.json --md .jankurai/repo-score.md"
path = ".jankurai/repo-score.md"
read_only = false
source = "installed jankurai binary"

[[zone]]
command = "hand-authored ABI surface; see docs/exceptions/ffi-c-header.md"
path = "contracts/c-abi/redlinedb.h"
read_only = true
source = "C ABI surface for the redlinedb sqlite3-compatible API; relocated from crates/ffi/include/ per docs/exceptions/ffi-c-header.md; not product truth"

[[zone]]
command = "rtk cargo run -p redlinedb-bench --bin sqlite_parity -- extract"
path = "crates/bench/sqlite_parity/cases/"
read_only = false
source = "SQLite parity corpus extracted from upstream SQLite test inputs; generated Rust case wrappers are audited through the manifest and runner"

# NOTE on crates/ffi/include/sqlite3.h: it is a 6-line hand-authored alias
# shim (`#include "../../../contracts/c-abi/redlinedb.h"`), NOT a generated
# file. Per the jankurai rubric, generated-zones is for tool-emitted artifacts
# only; hand-authored files belong in .jankurai/audit-policy.toml's exclusion
# lists (which already cover crates/ffi/include/** via extra_excluded_paths
# and extra_excluded_globs). The Batch A zone entry was an over-application;
# removed here to clear HLT-002-GENERATED-MUTATION (zone file presence check)
# without forcing a synthetic "Generated by:" header onto a 6-line shim.
