services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: redlinedb_beyond
      POSTGRES_USER: redlinedb
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${REDLINEDB_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redlinedb -d redlinedb_beyond"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
