# Canonical nested-family manifest. Paths are relative to this file.
schema_version = "1"
family = "redline-split"
parent_family = "independent"
container = "../redline-split"
lock = "redline.lock.toml"
consumers = ["jain-split", "jeryu-split"]

[control_plane]
name = "redline-split-ops"
remote = "http://127.0.0.1:8787/git/jeryu/redline-split-ops.git"
required_check = "redline-split-ops/required"
family = "redline-split"

[[consumer]]
family = "jain-split"
role = "nested-dependency"
lock_field = "nested.redline"

[[consumer]]
family = "jeryu-split"
role = "nested-dependency"
lock_field = "nested.redline"

[[repo]]
name = "redline"
path = "../redline-split/redline"
github_slug = "neverhuman/RedlineDB"
jeryu_slug = "jeryu/redlineDB"
role = "public-hub"
profile = "custom"
has_jeryu_std = true
current_tag = "redline-v4.1.0-jain.1"
required_check = "redline/required"
default_branch = "main"

[[repo]]
name = "redline-core"
path = "../redline-split/redline-core"
github_slug = "neverhuman/redline-core"
jeryu_slug = "jeryu/redline-core"
role = "canonical-engine"
profile = "custom"
has_jeryu_std = true
current_tag = "redline-core-v4.1.0-jain.1"
required_check = "redline-core/required"
default_branch = "main"

[[repo]]
name = "redline-testing"
path = "../redline-split/redline-testing"
github_slug = "neverhuman/redline-testing"
jeryu_slug = "jeryu/redline-testing"
role = "parity-harness"
profile = "custom"
has_jeryu_std = true
current_tag = "redline-testing-v1.0.1-jain.0"
required_check = "redline-testing/required"
default_branch = "main"

[[repo]]
name = "redline-web"
path = "../redline-split/redline-web"
github_slug = "neverhuman/redline-web"
jeryu_slug = "jeryu/redline-web"
role = "observability-console"
profile = "custom"
has_jeryu_std = true
current_tag = "redline-web-v0.1.0-jain.0"
required_check = "redline-web/required"
default_branch = "main"
