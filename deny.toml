[advisories]
ignore = []
unmaintained = "workspace"

# Keep the allowlist intentionally smaller than the family template. Unicode-3.0
# is required by the locked serde derive parser used for closed authority and
# evidence envelopes.
[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
