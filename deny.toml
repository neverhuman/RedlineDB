# cargo-deny supply-chain policy for the RedlineDB hub crate.
# Schema targets cargo-deny >= 0.16 (advisories/licenses lint-level fields were
# replaced: vulnerabilities are denied by default; licenses are allow-listed).

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities and unsound advisories are denied by default and cannot be
# downgraded. Yanked crates warn rather than fail. Unmaintained advisories are
# enforced for first-party (workspace) crates only — a transitive dep going
# unmaintained should not red-build a release hub.
yanked = "warn"
unmaintained = "workspace"
ignore = []

[licenses]
# Deny any crate whose SPDX expression isn't covered by this allow-list.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-DFS-2016",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
