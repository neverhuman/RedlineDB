[advisories]
version = 2
# No explicit db-path: use cargo-deny's default ($CARGO_HOME/advisory-dbs),
# which the sealed offline host CI pre-stages. A hardcoded ~/.cargo/advisory-db
# points at an unstaged location and makes the advisory scan fail closed in the
# network-isolated sandbox.
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
