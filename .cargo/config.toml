[build]
jobs = 50

# Fastest local Linux build lane: optimize the generated code for the CPU
# that builds RedlineDB. This intentionally favors source-built deployment
# speed over portable binary reuse. For a portable x86-64 artifact, override
# the CPU locally, for example:
#   RUSTFLAGS="-C link-arg=-fuse-ld=mold -C target-cpu=x86-64-v3" cargo ...
#
# Runtime SIMD still uses feature-detected dispatch where the codebase has
# explicit vector lanes, while `target-cpu=native` lets LLVM specialize scalar
# parser, RQL, comparison, and storage hot paths for the deployment host.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "target-cpu=native",
    "-C", "force-frame-pointers=no",
]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "target-cpu=native",
    "-C", "force-frame-pointers=no",
]
