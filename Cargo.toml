[workspace]
members = [
    "crates/domain",
    "crates/kernel",
    "crates/sql",
    "crates/bench",
    "crates/redlinedb",
    "crates/redlinedb-tokio",
    "crates/redlinedb-sqlx",
    "crates/ffi",
    "crates/cli",
    "crates/server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
