[package]
name = "redlinedb-cli"
version = "3.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
redlinedb = { path = "../redlinedb" }
serde_json = "1"
clap = { version = "4.5.4", features = ["derive"] }
rustyline = "14.0.0"
csv = "1.3.0"
crossterm = "0.27.0"
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "redlinedb"
path = "src/main.rs"

[[bin]]
name = "redlinedb-cli"
path = "src/bin/redlinedb-cli.rs"
