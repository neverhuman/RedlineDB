[package]
name = "redlinedb-cli"
version = "4.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["alloc-mimalloc"]
# WS-B4: normal builds select exactly one global allocator. The release
# --all-features qualification combination selects the default mimalloc while
# compiling all optional allocator dependency graphs; exact pairs remain
# invalid. main.rs / bin/redlinedb-cli.rs enforce this contract.
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]
alloc-snmalloc = ["dep:snmalloc-rs"]

[dependencies]
redlinedb = { path = "../redlinedb" }
serde_json = "1"
clap = { version = "4.5.4", features = ["derive"] }
rustyline = "14.0.0"
csv = "1.3.0"
crossterm = "0.27.0"
itoa = "1"
memchr = "2"
memmap2 = "0.9.11"
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.6", optional = true }
# Build snmalloc's Rust shim directly with the supported C++17 `cc` backend;
# this avoids a CMake dependency while retaining wait-on-address behavior.
snmalloc-rs = { version = "0.3", default-features = false, features = [
    "build_cc",
    "usecxx17",
    "usewait-on-address",
], optional = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "redlinedb"
path = "src/main.rs"

[[bin]]
name = "redlinedb-cli"
path = "src/bin/redlinedb-cli.rs"
