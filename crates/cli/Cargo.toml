[package]
name = "redlinedb-cli"
version = "4.0.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["alloc-mimalloc"]
# WS-B4: mutually-exclusive global allocator selection. Exactly one of these
# must be active; main.rs / bin/redlinedb-cli.rs enforce this via compile_error!.
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]
alloc-snmalloc = ["dep:snmalloc-rs"]

[dependencies]
redlinedb = { path = "../redlinedb" }
serde_json = "1"
clap = { version = "4.5.4", features = ["derive"] }
rustyline = "14.0.0"
csv = "1.3.0"
crossterm = "0.27.0"
itoa = "1"
memchr = "2"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.6", optional = true }
# snmalloc-rs requires a working `cmake` and a C++17 toolchain at build time.
# It is opt-in via the `alloc-snmalloc` feature so default builds (mimalloc) do
# not regress on hosts without cmake.
snmalloc-rs = { version = "0.3", optional = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "redlinedb"
path = "src/main.rs"

[[bin]]
name = "redlinedb-cli"
path = "src/bin/redlinedb-cli.rs"
