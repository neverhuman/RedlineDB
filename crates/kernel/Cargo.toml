[package]
name = "redlinedb-kernel"
version = "4.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ahash = "0.8"
arc-swap = "1.7"
bumpalo = "3"
crc32fast = "1.5"
# Phase 6 R4-B (wal_pipeline): bounded channel for the dedicated
# append-only WAL writer thread. The crate is opt-in via the
# `wal_pipeline` feature, but Cargo's resolver requires it sit
# unconditionally in `[dependencies]` for `optional = true` to work.
crossbeam-channel = { version = "0.5", optional = true }
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
fail = { version = "0.5", features = ["failpoints"], optional = true }
parking_lot = "0.12"
redlinedb-domain = { path = "../domain" }
rustix = { version = "=1.1.4", features = ["thread"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.23"

[features]
default = ["vector_v1_unmerged"]
failpoints = ["dep:fail"]
# Phase 5 WS-B6: opt-in NUMA-aware buffer-pool shard pinning. Off by
# default — the no-feature build is byte-identical to the pre-B6 binary.
numa = ["dep:rustix"]
# Lane V2 ships a minimal scalar distance shim while Lane V1's
# real `vector::distance` module is in flight. Fusion deletes this
# feature flag and the gated items in `crates/kernel/src/vector/distance.rs`
# in one pass, leaving Lane V1's SIMD-aware kernels in place.
vector_v1_unmerged = []
# WS-C6: opt-in cross-lane WAL flush coalescer.
wal_cross_lane_coalescer = []
# Phase 6 R4-B (Candidate 4): opt-in append-only WAL writer thread
# with `writev`/`pwritev` batching and a dirty-page queue sorted by
# page id. Off by default — the no-feature build does not pull in
# `crossbeam-channel` and is byte-identical to the pre-R4-B binary.
wal_pipeline = ["dep:crossbeam-channel"]
