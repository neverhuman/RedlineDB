[package]
name = "redlinedb-kernel"
version = "4.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ahash = "0.8"
arc-swap = "1.7"
bumpalo = "3"
crc32fast = "1.5"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
fail = { version = "0.5", features = ["failpoints"], optional = true }
hwlocality = { version = "=1.0.0-alpha.12", optional = true }
parking_lot = "0.12"
redlinedb-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.23"

[features]
default = ["vector_v1_unmerged"]
failpoints = ["dep:fail"]
# Phase 5 WS-B6: opt-in NUMA-aware buffer-pool shard pinning. Off by
# default — the no-feature build is byte-identical to the pre-B6 binary.
numa = ["dep:hwlocality"]
# Lane V2 ships a minimal scalar distance shim while Lane V1's
# real `vector::distance` module is in flight. Fusion deletes this
# feature flag and the gated items in `crates/kernel/src/vector/distance.rs`
# in one pass, leaving Lane V1's SIMD-aware kernels in place.
vector_v1_unmerged = []
