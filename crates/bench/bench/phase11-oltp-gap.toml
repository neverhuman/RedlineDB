# Phase 11 wave 1a: OLTP perf-gap harness.
#
# Runs the new wave-1a workloads alongside the published Phase 10
# OLTP shapes so regressions and improvements stay comparable to the
# numbers in `docs/archive/tips/benchmark_feedback/v2/`.
#
# Threads: 1 + 8 across OLTP shapes. Hot-counter update sticks at
# `threads = 1` because the workload's purpose is to establish a
# single-thread baseline the future commutative-delta combiner will
# be evaluated against. The threaded number is captured in the
# `writers-disjoint` row instead.
#
# Cold/warm covering range pairs run threads = 1 only so the cache
# story (cold reopens; warm warms) is interpreted unambiguously.

out_dir = "target/bench/phase11-oltp-gap"
workloads = [
  "secondary-index-read",
  "secondary-index-range",
  "secondary-index-count",
  "secondary-index-ordered-limit",
  "covered-range-cold",
  "covered-range-warm",
  "hot-row-update",
  "hot-counter-update",
  "point-read-pk",
  "writers-disjoint",
]
durabilities = ["strict"]
threads = [1, 8]
rows = 4096
seconds = 2
cache_mib = 32
