[package]
name = "redlinedb-ffi"
version = "1.0.25"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "redlinedb"
# `rlib` joins `cdylib`/`staticlib` so integration tests under `tests/`
# (Section D1 `safety_invariants.rs` + Section E `exec_input_boundary.rs`)
# can link the public `rldb_*` / `sqlite3_*` symbols as a normal Rust
# dependency. The cdylib/staticlib symbol set is unchanged — `rlib` is
# purely an additional output format used by `cargo test --test`.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
redlinedb-kernel = { path = "../kernel" }
redlinedb-sql = { path = "../sql" }

[dev-dependencies]
tempfile = "3"
