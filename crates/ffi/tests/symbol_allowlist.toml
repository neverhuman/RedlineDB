[[exclude]]
symbol = "sqlite3_expanded_sql"
reason = "Expanded SQL introspection; covered by sqlite3_sql"

# ---- 64-bit-length variants (covered by 32-bit length APIs) -----------

[[exclude]]
symbol = "sqlite3_bind_blob64"
reason = "Large-blob 64-bit length variant; sqlite3_bind_blob covers fresh apps"

[[exclude]]
symbol = "sqlite3_bind_text64"
reason = "Large-text 64-bit length variant; sqlite3_bind_text covers fresh apps"

[[exclude]]
symbol = "sqlite3_result_blob64"
reason = "Large-blob 64-bit result variant; sqlite3_result_blob covers fresh apps"

[[exclude]]
symbol = "sqlite3_result_text64"
reason = "Large-text 64-bit result variant; sqlite3_result_text covers fresh apps"

# ---- sqlite3_data_count (covered by sqlite3_column_count) -------------

[[exclude]]
symbol = "sqlite3_data_count"
reason = "Per-step column count; sqlite3_column_count covers fresh apps"

# ---- Extended error reporting (covered by errmsg / errcode) -----------

[[exclude]]
symbol = "sqlite3_extended_errcode"
reason = "Extended error code subset; sqlite3_errcode covers fresh apps"

[[exclude]]
symbol = "sqlite3_error_offset"
reason = "Parse-error offset reporter; covered by errmsg for fresh apps"

# ---- Schema introspection (covered by pragma_table_info WS-C2) --------

[[exclude]]
symbol = "sqlite3_table_column_metadata"
reason = "Schema introspection; pragma_table_info covers fresh apps (workstream C2)"

# ---- Transaction-state introspection (covered by get_autocommit) ------

[[exclude]]
symbol = "sqlite3_txn_state"
reason = "Txn-state introspection; sqlite3_get_autocommit covers fresh apps"

# ---- Rarely-used helpers (covered by other APIs or simply unused) -----

[[exclude]]
symbol = "sqlite3_set_last_insert_rowid"
reason = "Manual rowid override; future workstream candidate (rare)"

[[exclude]]
symbol = "sqlite3_autovacuum_pages"
reason = "Autovacuum tuning hook; RedlineDB exposes VACUUM via SQL"

[[exclude]]
symbol = "sqlite3_progress_handler"
reason = "Per-statement progress callback (rare); future workstream candidate"

# ---- UDF-internal helpers that have no fresh-app entry point ----------
# These ship only via the UDF surface (WS-B2) but the public API is the
# registration call sqlite3_create_function, not these helpers. Once
# WS-B2 ships these symbols become exported too and the rows can be
# removed atomically.

[[exclude]]
symbol = "sqlite3_get_clientdata"
reason = "Clientdata helper added in modern SQLite; out of fresh-app scope"

[[exclude]]
symbol = "sqlite3_set_clientdata"
reason = "Clientdata helper added in modern SQLite; out of fresh-app scope"

[[exclude]]
symbol = "sqlite3_value_encoding"
reason = "UDF text-encoding helper; UTF-8 only (no choice surface)"

[[exclude]]
symbol = "sqlite3_value_nochange"
reason = "Virtual-table-only helper; ships with vtab API (out of scope)"
