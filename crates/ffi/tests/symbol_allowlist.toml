# FFI symbol-diff allowlist.
#
# Every libsqlite3 public symbol that RedlineDB does NOT export and is NOT
# in the active fresh-application scope of `docs/sqlite-parity.md` must
# appear here with a one-line justification.
#
# IMPORTANT: per `.jankurai/JANKURAI_STANDARD.md` and the parity closure plan
# at /Users/bentaylor/.claude/plans/it-is-important-that-dazzling-leaf.md
# (rule "do not skip any libsqlite3 symbol to make the gate pass"), this
# file MUST NOT include symbols that are merely "planned" by workstream
# B1-B4. Such symbols must fail the gate so workstream B has a forcing
# function. Only legitimately out-of-scope items go here.
#
# Categories of legitimate exclusion:
#
#   - UTF-16 ("*16", "*16le", "*16be") variants: RedlineDB is UTF-8 native;
#     fresh applications use UTF-8 text APIs.
#   - SQLite native on-disk format APIs: serialize/deserialize, snapshot
#     blobs, page-format helpers, and the explicit `not-started` rows of
#     `docs/sqlite-parity.md` (file-format section).
#   - SQLite WAL byte-format APIs: WAL frame hooks against the native
#     SQLite WAL format are not part of the RedlineDB WAL (we ship a
#     native WAL with the same durability guarantees but a different
#     on-disk encoding).
#   - C runtime helpers that wrap the SQLite-owned allocator: `sqlite3_malloc`,
#     `sqlite3_str_*`, formatted-string printers, etc. — RedlineDB callers
#     use their language's allocator.
#   - SQLite-specific mutex / VFS / OS interface helpers: RedlineDB is
#     pure Rust and uses the Rust ecosystem's locking/IO primitives.
#   - Loadable extensions / virtual tables: explicit out-of-scope decision;
#     fresh applications use the native Rust extension surface.
#   - Test, internal, and deprecated functions never used by fresh code.
#
# Anything NOT on this list AND not exported by the RedlineDB FFI cdylib
# causes `tests/symbol_diff.rs` to fail.

