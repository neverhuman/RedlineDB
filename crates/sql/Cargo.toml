[package]
name = "redlinedb-sql"
version = "4.0.8"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ahash = "0.8"
arc-swap = "1.7"
bumpalo = "3"
libm = "0.2"
memchr = "2"
parking_lot = "0.12"
rayon = "1"
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }
smallvec = "1.13"
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlparser = "0.61"
tempfile = "3.23"
thiserror = "2.0"
redlinedb-kernel = { path = "../kernel" }

[dev-dependencies]
tempfile = "3.23"
fail = { version = "0.5", features = ["failpoints"] }
proptest = "1.5"
rusqlite = { version = "0.37.0", features = ["bundled", "functions"] }
postgres = "0.19"

[features]
default = []
# Lane KH P0 #3: enables `failpoints` in the kernel transitively so the
# commit-failure rollback test can arm `engine::commit::before_publish`
# with a `return(...)` action and observe SQL-side index repair.
failpoints = ["redlinedb-kernel/failpoints"]
