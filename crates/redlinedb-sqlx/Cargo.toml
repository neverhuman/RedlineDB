[package]
name = "redlinedb-sqlx"
version = "1.0.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SQLx Any driver bridge for RedlineDB URLs."
repository = "https://github.com/neverhuman/RedlineDB"
keywords = ["database", "async", "sqlx", "redlinedb"]
categories = ["database", "asynchronous"]

[dependencies]
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
redlinedb = { path = "../redlinedb", version = "1.0.2" }
sqlx = { package = "sqlx-core", version = "0.8.6", features = ["any", "_rt-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
url = "2"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
