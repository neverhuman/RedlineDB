[package]
name = "redlinedb"
version = "1.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
redlinedb-kernel = { path = "../kernel" }
redlinedb-sql = { path = "../sql" }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
uuid = { version = "1", optional = true }
rust_decimal = { version = "1", default-features = false, optional = true }

[features]
default = []
# Built-in async wrappers (AsyncDatabase / AsyncConnection / AsyncPool).
# Internally calls tokio::task::spawn_blocking to bridge the sync engine.
tokio = ["dep:tokio"]
# Postgres-style type bridges. Each adds From + TryFrom impls between Value
# and the named Rust type; the underlying storage class never changes
# (so the sqlite drop-in surface is preserved).
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]
json = []  # serde_json is already an unconditional dep; this feature gates the Value bridges
decimal = ["dep:rust_decimal"]
# Internal test-only feature — arms kernel failpoints for crash-injection tests.
# Not for production use; not covered by semver stability guarantees.
failpoints = ["redlinedb-kernel/failpoints", "redlinedb-sql/failpoints"]

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
