[package]
name = "db-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Switchable SQLite|RedlineDB abstraction (rusqlite-shaped, .env-driven, {ns} table prefixing)."

[dependencies]
redlinedb-client = { path = "../redlinedb-client" }
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "db-shim-parity"
path = "src/bin/parity.rs"
