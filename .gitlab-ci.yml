workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never

stages:
  - validate
  - package

default:
  image: rust:1.95-bookworm
  cache:
    key: "cargo-${CI_JOB_IMAGE}"
    paths:
      - .cargo/git/
      - .cargo/registry/
      - target/

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  DEBIAN_FRONTEND: "noninteractive"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  # Override runner-injected sccache wrapper — the sccache remote-cache stalls
  # indefinitely on this runner when compiling the main crate. Disable it so
  # rustc is invoked directly and the build completes predictably.
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLED: "1"

.evict_sccache: &evict_sccache
  # The runner re-applies RUSTC_WRAPPER=sccache after yaml-variable resolution,
  # so unsetting in before_script (same shell as script:) is the only reliable
  # intercept point.
  - unset RUSTC_WRAPPER
  - pkill sccache 2>/dev/null || true

.install_sqlite3_new: &install_sqlite3_new
  # Bookworm ships sqlite3 3.40.1; capability_probe_works requires JSONB (3.45+).
  # Install the official precompiled sqlite3 3.46.1 to /usr/local/bin/ so it
  # takes precedence on PATH and the capability probe test passes.
  - curl -fsSL https://www.sqlite.org/2024/sqlite-tools-linux-x64-3460100.zip -o /tmp/sqlite3.zip
  - unzip -o -j /tmp/sqlite3.zip sqlite3 -d /usr/local/bin/
  - chmod +x /usr/local/bin/sqlite3
  - sqlite3 --version

pr_ci:
  stage: validate
  timeout: 2h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - *evict_sccache
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git jq sqlite3 unzip
    - *install_sqlite3_new
  script:
    - bash scripts/ci-local.sh pr-ci

beyond_postgres:
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  services:
    - name: postgres:16
      alias: postgres
      command:
        - postgres
        - -c
        - fsync=off
  variables:
    POSTGRES_DB: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_PASSWORD: postgres
    REDLINE_TESTING_POSTGRES_URL: postgresql://postgres@postgres:5432/postgres
  before_script:
    - *evict_sccache
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git jq postgresql-client sqlite3
  script:
    - cargo test --locked --test beyond_sqlite_smoke
    - cargo build --release --locked
    - mkdir -p out
    - ./target/release/redline-testing run --suite beyond_sqlite --target-bin sqlite3 --output out/beyond.jsonl --memory-samples
    - head -50 out/beyond.jsonl
  artifacts:
    when: always
    paths:
      - out/beyond.jsonl

security:
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git jq sqlite3
  script:
    - bash scripts/ci-local.sh security

audit:
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git jq sqlite3
  script:
    - bash scripts/ci-local.sh audit

release_package:
  stage: package
  timeout: 2h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - *evict_sccache
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git jq sqlite3 unzip
    - *install_sqlite3_new
  script:
    - bash scripts/ci-local.sh pr-ci
    - bash scripts/ci-local.sh release
  artifacts:
    when: always
    paths:
      - dist/
