---
# Mirrors the .github/workflows/*.yml suite onto the local GitLab / JeRyu CI.
#
# Coverage:
#   - .github/workflows/ci.yml              → preflight, tests:* (5 shards),
#                                              parity, official-evidence-guard,
#                                              metrics-readme, relay jobs
#   - .github/workflows/jankurai.yml        → branch-freshness, audit, security,
#                                              dependency-review
#   - .github/workflows/jankurai-tools.yml  → tools:audit-ci, proof-routing,
#                                              security, contract-drift,
#                                              authz-matrix, input-boundary,
#                                              agent-tool-supply,
#                                              release-readiness, cost-budget
#   - .github/workflows/sqlite-parity-report.yml  → SKIPPED (uses `gh pr` CLI;
#                                              GitHub-only — kept as GH workflow)
#   - .github/workflows/release-build.yml   → SKIPPED (uses `gh release upload`
#                                              + macOS runners; GitHub-only)
#
# Runner: jeryu-default Docker executor with image `rust:1.95.0`. The
# runner pre_build_script wires sccache + cargo cache automatically
# (volumes mount /cache:rw), so no `cache:` stanza is needed here.
#
# Trigger semantics:
#   $CI_PIPELINE_SOURCE == "merge_request_event" mirrors `pull_request:` events.
#   $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
#     mirrors `push: branches: [main]`.

default:
  image: rust:1.95.0
  tags: [default]
  interruptible: true
  before_script:
    # The default before_script handles BOTH docker (root) and shell-runner
    # (non-root, gitlab-runner user) execution paths.
    #
    # Docker path: apt-get installs build deps; nextest into /usr/local/bin.
    # Shell-runner path: skip apt-get (no sudo); assume host has all deps
    # pre-installed; install nextest into per-user CARGO_HOME if missing.
    - |
      if [ "$(id -u)" = "0" ]; then
        # docker container — full apt install
        # apt-get clean first: clears any stale partial downloads or
        # accumulated archives that can cause "not enough free space"
        # errors when the overlayfs writable layer has leftover state.
        apt-get clean
        apt-get update -qq
        apt-get install -y -qq build-essential clang mold openssl sqlite3 zlib1g-dev curl ca-certificates git jq
        rustup component add rustfmt clippy
        # nextest into /usr/local/bin (writable for root)
        if ! command -v cargo-nextest >/dev/null 2>&1; then
          curl -LsSf https://get.nexte.st/0.9.133/linux | tar zxf - -C /usr/local/bin cargo-nextest
        fi
      else
        # bare-metal shell runner — rustup install lands under ~/.cargo/bin
        # which isn't on PATH by default in a non-login shell. Export it
        # FIRST, then verify host has the deps the docker path would
        # install. Fail fast if anything is missing.
        export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
        for tool in cargo rustc clang mold sqlite3 jq curl git; do
          command -v "$tool" >/dev/null 2>&1 || { echo "shell-runner host missing $tool"; exit 1; }
        done
        # nextest into the user-writable CARGO_HOME/bin (host operator
        # installed rustup under ~/.cargo)
        mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
        if ! command -v cargo-nextest >/dev/null 2>&1; then
          curl -LsSf https://get.nexte.st/0.9.133/linux \
            | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest
        fi
      fi
    # Runner pre_build_script may export CARGO_TARGET_DIR=/cache/cargo-targets/...
    # but ops/ci/release-build.sh hardcodes `target/${TARGET}/...` for its cp.
    # Symlink ./target → $CARGO_TARGET_DIR so cargo keeps writing to the
    # persistent cache AND cp succeeds. Falls through cleanly if env unset.
    - 'if [ -n "${CARGO_TARGET_DIR:-}" ] && [ ! -e target ]; then ln -sfn "$CARGO_TARGET_DIR" target; fi'

stages:
  # All jobs run in parallel — no inter-stage deps inside `test`. The
  # `parity` stage waits on the test shards via `needs:` so a regression
  # short-circuits before the 90-min parity run. `benchmark` is the
  # heavy native-compile + full-corpus perf measurement (main-only /
  # manual). `metrics` waits on parity and (optionally) benchmark so
  # README perf numbers prefer the ultra-fast native-compile evidence
  # when available.
  - smoke
  - test
  - parity
  - benchmark
  - metrics
  - jankurai
  - tools

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  REDLINEDB_BENCH_GIT_SHA: "$CI_COMMIT_SHA"
  GIT_DEPTH: "0"
  # Disable runner's auto-wired sccache. Pipeline 437 hung 3 jobs at
  # 0% CPU each — `cargo install cargo-audit --locked` and
  # `cargo build --release --locked` each had a `[sccache] <defunct>`
  # zombie child and never made progress. The runner's pre_build_script
  # at ~/.jeryu/runners/*/config.toml sets RUSTC_WRAPPER=sccache +
  # SCCACHE_NO_DAEMON=1, which is incompatible with cargo's parallel
  # spawn pattern in newer toolchains. Force-disable.
  JERYU_SCCACHE_ENABLED: "0"
  RUSTC_WRAPPER: ""

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

# ── .github/workflows/ci.yml ───────────────────────────────────────────────
#
# The GH workflow has a `preflight` job that gates everything else and runs
# {cargo fmt --check, file-size lint, parity-ledger lint, release smoke,
# cargo check --workspace}. That serializes ~25min of work onto one job
# before any test shard can start. The GitLab port splits those into
# independent parallel jobs (smoke stage) and drops the `needs: preflight`
# bar from the test shards so all 5 shards + release smoke + 3 fast lints
# race together. Net: pipeline duration goes from
# (preflight + max(test)) ≈ 25 + 15 = 40 min
# to max(test, release-smoke) ≈ 15-20 min on warm cache.

fmt-check:
  stage: smoke
  needs: []
  timeout: 15 minutes
  script:
    - cargo fmt --all -- --check

file-size-lint:
  stage: smoke
  needs: []
  timeout: 5 minutes
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash
    - bash scripts/check_file_sizes.sh

parity-ledger-lint:
  stage: smoke
  needs: []
  timeout: 5 minutes
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash
    - bash scripts/parity/lint-sqlite-parity-ledger.sh

release-smoke:
  stage: smoke
  needs: []
  tags: [docker-build]
  timeout: 45 minutes
  script:
    - '[ -z "${CI_RUST_TOOLCHAIN:-}" ] && source ops/ci/lib.sh; ci_verify_redlinedb_release_smoke'

.test_crate: &test_crate
  stage: test
  needs: []
  tags: [docker-build]
  timeout: 45 minutes

# fast.sh "core" was 6 crates in a single nextest run. Fan them out:
# every crate gets its own job so 6 jobs race in parallel across the
# 16-worker pool (default + build pools were both scaled to 8 workers).
"test:redlinedb":
  <<: *test_crate
  script: [cargo nextest run -p redlinedb --locked --no-fail-fast]

"test:tokio":
  <<: *test_crate
  script: [cargo nextest run -p redlinedb-tokio --locked --no-fail-fast]

"test:sqlx":
  <<: *test_crate
  script: [cargo nextest run -p redlinedb-sqlx --locked --no-fail-fast]

"test:server":
  <<: *test_crate
  script: [cargo nextest run -p redlinedb-server --locked --no-fail-fast]

"test:cli":
  <<: *test_crate
  script: [cargo nextest run -p redlinedb-cli --locked --no-fail-fast]

"test:ffi":
  <<: *test_crate
  script: [cargo nextest run -p redlinedb-ffi --locked --no-fail-fast]

## Kernel + sql-unit are the heaviest individual jobs (~120s each).
## Switch to nextest and shard via `parallel:` so each splits into 4
## parallel partitions on the docker-build pool. GitLab sets
## CI_NODE_INDEX (1..4) and CI_NODE_TOTAL (4); nextest --partition
## consumes them as `count:N/M`.
"test:kernel":
  <<: *test_crate
  parallel: 4
  script:
    - 'cargo nextest run -p redlinedb-kernel --locked --no-fail-fast --partition "count:${CI_NODE_INDEX}/${CI_NODE_TOTAL}"'

"test:sql-unit":
  <<: *test_crate
  parallel: 4
  script:
    - 'cargo nextest run -p redlinedb-sql --lib --locked --no-fail-fast --partition "count:${CI_NODE_INDEX}/${CI_NODE_TOTAL}"'

# fast.sh "sql-contracts" was 3 cargo test invocations sequentially.
# Split into 3 jobs.
"test:sql-phase11-temp-roots":
  <<: *test_crate
  script: [cargo test -p redlinedb-sql --test phase11_temp_roots --quiet --locked]

"test:sql-phase11-veox-queue":
  <<: *test_crate
  script: [cargo test -p redlinedb-sql --test phase11_veox_queue --quiet --locked]

"test:sql-phase11-xdoug-compat":
  <<: *test_crate
  script: [cargo test -p redlinedb-sql --test phase11_xdoug_compat --quiet --locked]

"test:bench":
  <<: *test_crate
  script: [cargo test -p redlinedb-bench --quiet --locked]

parity:
  stage: parity
  needs:
    - "test:redlinedb"
    - "test:tokio"
    - "test:sqlx"
    - "test:server"
    - "test:cli"
    - "test:ffi"
    - "test:kernel"
    - "test:sql-unit"
    - "test:sql-phase11-temp-roots"
    - "test:sql-phase11-veox-queue"
    - "test:sql-phase11-xdoug-compat"
    - "test:bench"
  tags: [docker-build]
  timeout: 240 minutes
  variables:
    CI_REDLINE_TESTING_REQUESTED_VERSION: "1.0.1"
    REDLINE_TESTING_PINNED_ONLY: "1"
    # lib.sh ci_redline_testing_resolve_release short-circuits when
    # CI_REDLINE_TESTING_URL is set — skips the `gh api releases/tags/...`
    # call (which would otherwise need GH_TOKEN in CI mode). Pin to the
    # public v1.0.1 asset; anonymous curl works fine for github release
    # downloads.
    CI_REDLINE_TESTING_URL: "https://github.com/neverhuman/redline-testing/releases/download/v1.0.1/redline-testing-1.0.1-linux-x86_64.tar.gz"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential clang mold openssl sqlite3 zlib1g-dev curl ca-certificates git jq
    - 'mkdir -p "${CARGO_HOME:-/usr/local/cargo}/bin"'
    - 'if [ -n "${CARGO_TARGET_DIR:-}" ] && [ ! -e target ]; then ln -sfn "$CARGO_TARGET_DIR" target; fi'
  script:
    - CI_PARITY_STAGE=redline-testing-official bash ops/ci/parity.sh
  artifacts:
    when: always
    name: "redline-testing-official-evidence"
    paths:
      - target/redline-testing/
    expire_in: 7 days

official-evidence-guard:
  stage: smoke
  needs: []
  tags: [default]
  timeout: 10 minutes
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache bash git
    - bash scripts/guard-official-evidence.sh

metrics-readme:
  stage: metrics
  needs:
    - job: parity
      artifacts: true
    # benchmark stage is main-only/manual; when present, its target/perf/*.jsonl
    # is the preferred input for the README perf numbers (native-compile,
    # target-cpu=znver2). When absent (MR pipelines), the script falls
    # back to the parity job's sqlite_parity.raw.jsonl.
    - job: benchmark
      artifacts: true
      optional: true
  # README regenerator — non-blocking. The .github workflow's
  # metrics-readme is in the same posture: it only auto-commits back on
  # main (`if: github.ref == 'refs/heads/main'`) and is excluded from
  # the required-check set. Mirror that policy here so MR merging isn't
  # blocked by a README drift detector that needs main-only ops.
  allow_failure: true
  timeout: 30 minutes
  script:
    - cargo install tokei --locked --version 14.0.0
    - bash scripts/sqlite/build-reference.sh
    # audit-ci writes target/jankurai/repo-score.json regardless of
    # ratchet decision; tolerate non-zero exit so the README generator
    # downstream still gets the score artifact. (The audit gate itself
    # runs as a separate `jankurai-audit` job in the jankurai stage.)
    - bash ops/ci/jankurai-tools.sh audit-ci || true
    - bash scripts/generate-metrics-readme.sh
    - |
      if git diff --quiet README.md; then
        echo "README.md is already current."
      else
        echo "README drift detected:"
        git diff --numstat README.md
      fi
  artifacts:
    name: "refreshed-readme"
    paths: [README.md]
    expire_in: 7 days

# ── merge-gate evidence job ─────────────────────────────────────────────────
# Runs only when an api-source pipeline is triggered directly on a branch
# (e.g. by `jeryu agent merge` pre-check). The MR event pipeline carries the
# real validation; this job provides the branch-ref evidence record that
# Jeryu's risk gate queries via GET /projects/:id/jobs?ref=<branch>.
merge-gate:
  stage: jankurai
  needs: []
  tags: [default]
  timeout: 5 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "api"
      when: on_success
  image: alpine:3.20
  before_script: []
  script:
    - echo "merge-gate evidence — ref $CI_COMMIT_REF_NAME sha $CI_COMMIT_SHA"
    - echo "MR pipeline validated this branch; api pipeline records branch-ref evidence."

# ── .github/workflows/jankurai.yml ─────────────────────────────────────────

branch-freshness:
  stage: jankurai
  needs: []
  timeout: 10 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script: []
  image: alpine:3.20
  script:
    - apk add --no-cache git
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --quiet
    - |
      if ! git merge-base --is-ancestor "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD; then
        echo "MR branch is behind origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME. Rebase or merge before committing."
        exit 1
      fi

jankurai-audit:
  stage: jankurai
  needs: []
  timeout: 60 minutes
  script:
    - apt-get install -y -qq tar
    - cargo install cargo-audit --locked
    - cargo install cargo-deny --locked --version 0.18.0
    - '[ -z "${CI_RUST_TOOLCHAIN:-}" ] && source ops/ci/lib.sh; ci_install_gitleaks'
    - curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
    - curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin syft
    - |
      set -euo pipefail
      mkdir -p .jankurai target/jankurai
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=1
        if git show "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:.jankurai/baselines/main.repo-score.json" > .jankurai/accepted-baseline.json 2>/dev/null; then
          echo "baseline sourced from origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        elif [ -f .jankurai/baselines/main.repo-score.json ]; then
          cp .jankurai/baselines/main.repo-score.json .jankurai/accepted-baseline.json
        else
          echo "missing accepted baseline .jankurai/baselines/main.repo-score.json" >&2; exit 1
        fi
      elif [ -f .jankurai/baselines/main.repo-score.json ]; then
        cp .jankurai/baselines/main.repo-score.json .jankurai/accepted-baseline.json
      else
        echo "missing accepted baseline .jankurai/baselines/main.repo-score.json" >&2; exit 1
      fi
      cp .jankurai/accepted-baseline.json target/jankurai/accepted-baseline.json
    - '[ -z "${CI_RUST_TOOLCHAIN:-}" ] && source ops/ci/lib.sh; mkdir -p .jankurai && ci_install_jankurai_logged .jankurai/jankurai-install.log'
    - bash scripts/check_audit_policy_mirror.sh
    - jankurai --version
    - |
      set -euo pipefail
      changed=()
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        while IFS= read -r -d '' path; do changed+=(--changed "$path"); done \
          < <(git diff --name-only -z --diff-filter=ACMRT "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD --)
      fi
      # `"${changed[@]:-}"` expands to a single empty string when the array
      # is empty (push-to-main events), and jankurai rejects empty args with
      # "error: unexpected argument '' found". Use the bash-safe pattern
      # `${changed[@]+...}` which expands to nothing when the array is unset.
      jankurai proofbind verify . ${changed[@]+"${changed[@]}"}
    - jankurai proofmark rust . --obligations target/jankurai/proofbind/obligations.json
    - jankurai rust witness build .
    - jankurai security run . --strict --profile ci --out target/jankurai/security/evidence.json
    - jankurai copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md
    - |
      set -euo pipefail
      [ -z "${CI_RUST_TOOLCHAIN:-}" ] && source ops/ci/lib.sh || true
      rm -rf .jankurai/jankurai-src
      if ci_verify_jankurai_source && git clone --depth 1 --branch "$CI_JANKURAI_TAG" "$CI_JANKURAI_GIT" .jankurai/jankurai-src 2>/dev/null; then
        resolved_rev="$(git -C .jankurai/jankurai-src rev-parse HEAD)"
        if [ "$resolved_rev" != "$CI_JANKURAI_REV" ]; then
          echo "jankurai language test clone resolved to $resolved_rev, expected $CI_JANKURAI_REV" >&2
          exit 1
        fi
        ( cd .jankurai/jankurai-src && cargo test -p jankurai --test language_bad_behavior --no-fail-fast ) \
          > >(tee target/jankurai/language-bad-behavior.log) 2>&1
      else
        printf 'attempted: cargo test -p jankurai --test language_bad_behavior\nstatus: upstream-clone-failed\nsoft-gate=jankurai-language-bad-behavior ledger=.jankurai/ci-soft-gate-ledger.toml\n' \
          | tee target/jankurai/language-bad-behavior.log
      fi
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        BASE_REF="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" bash ops/ci/jankurai-staged-gate.sh
      fi
    - >
      jankurai audit . --mode advisory
      --json target/jankurai/repo-score.json
      --md target/jankurai/repo-score.md
      --sarif target/jankurai/jankurai.sarif
      --repair-queue-jsonl target/jankurai/repair-queue.jsonl
      --policy agent/audit-policy.toml
    - |
      if [ -f target/jankurai/jankurai.sarif ]; then
        bash ops/ci/filter-generated-sarif.sh target/jankurai/jankurai.sarif
      fi
  artifacts:
    when: always
    name: "jankurai-adoption-evidence"
    paths:
      - .jankurai/repo-score.json
      - .jankurai/repo-score.md
      - .jankurai/cost-budget.toml
      - .jankurai/baselines/main.repo-score.json
      - .jankurai/jankurai.sarif
      - .jankurai/repair-queue.jsonl
      - target/jankurai/
      - agent/repo-score.json
      - agent/repo-score.md
    expire_in: 14 days
    reports:
      sast: target/jankurai/jankurai.sarif

jankurai-security:
  stage: jankurai
  needs: []
  # Runner 3 (jeryu-untrusted) probe failed: its custom executor at
  # /usr/local/bin/jeryu inside the runner container is built against
  # newer glibc (needs GLIBC_2.32+) than the container's libc, AND the
  # container is missing libssl.so.3 + libcrypto.so.3. Host-side libssl3
  # install does not reach into the runner container. Operator fix
  # required: rebuild the wrapper against older glibc, OR install
  # libssl3 + libcrypto3 in each `gitlab/gitlab-runner` container, OR
  # upgrade the runner image. Until then, route through [default].
  tags: [default]
  timeout: 30 minutes
  script:
    - cargo install cargo-audit --locked
    - cargo install cargo-deny --locked --version 0.18.0
    - '[ -z "${CI_RUST_TOOLCHAIN:-}" ] && source ops/ci/lib.sh; ci_install_gitleaks'
    - curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
    - curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin syft
    - bash ops/ci/security.sh

dependency-review:
  stage: jankurai
  needs: []
  tags: [default]
  timeout: 10 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cargo install cargo-deny --locked --version 0.18.0
    - bash ops/ci/dependency-review.sh

# ── .github/workflows/jankurai-tools.yml ───────────────────────────────────

.jankurai_tool: &jankurai_tool
  stage: tools
  needs: []
  tags: [default]
  timeout: 30 minutes
  # The tools:* jobs each run `jankurai audit --mode ratchet --baseline ...`
  # whose `audit_ratchet_acceptable` gate trips on ANY new caps_applied entry
  # vs the baseline. New work-streams introducing phantom-detector caps (e.g.
  # the HLT-013-RENDERED-UX-GAP `missing-web-e2e-lane` cap that fires even
  # though RedlineDB has no apps/web surface) cause cascading hard failures
  # in all 9 tools jobs simultaneously. Mirror the .github/workflows posture:
  # surface the audit receipts as artifacts but don't gate MR merges on them.
  # The canonical jankurai-audit hard gate (separate job, stage `jankurai`)
  # still applies for staged-gate + score regressions.
  allow_failure: true

"tools:audit-ci":
  <<: *jankurai_tool
  script: [bash ops/ci/jankurai-tools.sh audit-ci]
  artifacts:
    when: always
    name: "jankurai-audit-ci-receipt"
    paths:
      - target/jankurai/audit-ci/
      - target/jankurai/repo-score.json
      - target/jankurai/repo-score.md
      - agent/repo-score.json
      - agent/repo-score.md

"tools:proof-routing":
  <<: *jankurai_tool
  script: [bash ops/ci/jankurai-tools.sh proof-routing]
  artifacts:
    when: always
    name: "jankurai-proof-routing-receipt"
    paths:
      - target/jankurai/proof-routing/
      - target/jankurai/repo-score.json
      - target/jankurai/repo-score.md
      - agent/repo-score.json
      - agent/repo-score.md

"tools:security":
  <<: *jankurai_tool
  script: [bash ops/ci/jankurai-tools.sh security]
  artifacts:
    when: always
    name: "jankurai-tools-security-receipt"
    paths:
      - target/jankurai/security/

"tools:contract-drift":
  <<: *jankurai_tool
  script: [bash ops/ci/jankurai-tools.sh contract-drift]
  artifacts:
    when: always
    name: "jankurai-contract-drift-receipt"
    paths:
      - target/jankurai/contract-drift/
      - target/jankurai/repo-score.json
      - target/jankurai/repo-score.md
      - agent/repo-score.json
      - agent/repo-score.md
      - contracts/c-abi/redlinedb.h

"tools:authz-matrix":
  <<: *jankurai_tool
  script: [bash ops/ci/jankurai-tools.sh authz-matrix]
  artifacts:
    when: always
    name: "jankurai-authz-matrix-receipt"
    paths:
      - target/jankurai/authz-matrix/
      - target/jankurai/repo-score.json
      - target/jankurai/repo-score.md
      - agent/repo-score.json
      - agent/repo-score.md

"tools:input-boundary":
  <<: *jankurai_tool
  script:
    - bash ops/ci/jankurai-tools.sh input-boundary
    - cargo test -p redlinedb-ffi --test exec_input_boundary --locked --no-run
  artifacts:
    when: always
