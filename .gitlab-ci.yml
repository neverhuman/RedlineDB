# ── Native-compile benchmark (heavy, manual / main-only) ───────────────────
#
# Runs `scripts/perf/full.sh` end-to-end against the redline-testing
# v1.0.1 official corpus, with a `target-cpu=native` release build of
# `redlinedb-cli`. Writes `target/perf/<name>.jsonl` as the canonical
# CI-produced evidence — README perf numbers come from THIS artifact, not
# local hand-runs (closing the "benchmarking must be in CI" gap).
#
# Trigger semantics:
#   - Manual button on every pipeline (`when: manual`)
#   - Auto on main pushes (the `release` cell wants a fresh benchmark on
#     every merge)
# Skipped on MR pipelines because the 2-3hr corpus run isn't worth gating
# every MR on — parity (against pre-built evidence) covers regression
# detection. The benchmark job is for measurement, not gating.
benchmark:
  stage: benchmark
  # Default to the docker [build] pool. For maximum-fidelity bare-metal
  # benchmarks, the operator should register a shell runner tagged
  # [bench-native] (see scripts/ci/register-bench-runner.sh) and bump
  # this `tags:` line to [bench-native, build] so jobs prefer the shell
  # runner. Docker's overhead is ~2-5% on syscall-heavy workloads vs
  # bare-metal; the JSONL evidence is comparable across runs on the
  # same runner class, but only a shell runner gives numbers directly
  # comparable to local hand-runs.
  tags: [docker-build]
  needs: []
  timeout: 240 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    CI_REDLINE_TESTING_REQUESTED_VERSION: "1.0.1"
    REDLINE_TESTING_PINNED_ONLY: "1"
    CI_REDLINE_TESTING_URL: "https://github.com/neverhuman/redline-testing/releases/download/v1.0.1/redline-testing-1.0.1-linux-x86_64.tar.gz"
    PERF_WORKERS: "10"
    PERF_ROOT: "target/perf"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential clang mold openssl sqlite3 zlib1g-dev curl ca-certificates git jq python3
    - 'mkdir -p "${CARGO_HOME:-/usr/local/cargo}/bin"'
    - 'if [ -n "${CARGO_TARGET_DIR:-}" ] && [ ! -e target ]; then ln -sfn "$CARGO_TARGET_DIR" target; fi'
  script:
    # 1. Download + extract redline-testing tarball directly. We bypass
    #    `ci_install_redline_testing` because it forces `gh attestation
    #    verify` on github.com URLs, which needs an authenticated GH_TOKEN
    #    that the GitLab CI doesn't have. The tarball is public — anonymous
    #    curl is fine for the download.
    - mkdir -p target/ci/redline-testing
    - 'curl -fsSL "$CI_REDLINE_TESTING_URL" -o target/ci/redline-testing/redline-testing.tar.gz'
    - tar -xzf target/ci/redline-testing/redline-testing.tar.gz -C target/ci/redline-testing
    - export REDLINE_TESTING_BIN="$(find target/ci/redline-testing -maxdepth 3 -type f -name redline-testing -executable | head -1)"
    - "$REDLINE_TESTING_BIN version"
    # 2. Build the sqlite3 reference (3.53.1 release build) — pinned per
    #    scripts/sqlite/build-reference.sh so the comparison is stable.
    - bash scripts/sqlite/build-reference.sh
    - export SQLITE_REF_BIN="$(pwd)/target/sqlite-reference/3.53.1/bin/sqlite3"
    - "$SQLITE_REF_BIN --version"
    # 3. Compile RedlineDB release with explicit microarch targeting.
    #    The .cargo/config.toml default is x86-64-v3 (portable). For the
    #    benchmark we want the FULL Zen 2 microarch (the host is an AMD
    #    Ryzen Threadripper PRO 3995WX), so set target-cpu=znver2 instead
    #    of `native`. Reason: in docker, `target-cpu=native` reads the
    #    container's /proc/cpuinfo — which is host-visible by default but
    #    can be stripped by some kernel configs. Pinning to `znver2`
    #    deterministically captures all 18 Zen 2 microarch ISA hints
    #    (avx2/bmi2/fma/pclmul/sse4a/etc.) regardless of cpuid masking.
    #    When the operator switches to a shell runner (see
    #    scripts/ci/register-bench-runner.sh), `znver2` still applies;
    #    on a non-Zen-2 host the operator should change this line.
    - 'RUSTFLAGS="-C link-arg=-fuse-ld=mold -C target-cpu=znver2" cargo build --release --locked -p redlinedb-cli --bin redlinedb'
    - 'sha256sum target/release/redlinedb | tee target/perf-native-binary.sha256.txt || true'
    # 4. Run the full perf corpus (1127 cases × 3 reps + 1 warmup × 10 workers).
    #    ~2-3 hours wall time. PERF_TASKSET_DISABLE=1 lets workers span cores.
    - mkdir -p target/perf
    - 'bash scripts/perf/full.sh target/release/redlinedb v4.0.x-native-ci'
    # 5. Print summary
    - 'echo "== benchmark summary =="; ls -la target/perf/; head -20 target/perf/v4.0.x-native-ci.jsonl 2>/dev/null || true'
  artifacts:
    when: always
    name: "redlinedb-native-benchmark-evidence"
    paths:
      - target/perf/
      - target/perf-native-binary.sha256.txt
    expire_in: 30 days
    reports:
      metrics: target/perf/v4.0.x-native-ci.jsonl

benchmark-rql:
  stage: benchmark
  tags: [docker-build]
  needs: []
  timeout: 120 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    CI_REDLINE_TESTING_REQUESTED_VERSION: "1.0.1"
    REDLINE_TESTING_PINNED_ONLY: "1"
    CI_REDLINE_TESTING_URL: "https://github.com/neverhuman/redline-testing/releases/download/v1.0.1/redline-testing-1.0.1-linux-x86_64.tar.gz"
    PERF_WORKERS: "10"
    PERF_ROOT: "target/perf"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential clang mold openssl sqlite3 zlib1g-dev curl ca-certificates git jq python3
    - 'mkdir -p "${CARGO_HOME:-/usr/local/cargo}/bin"'
    - 'if [ -n "${CARGO_TARGET_DIR:-}" ] && [ ! -e target ]; then ln -sfn "$CARGO_TARGET_DIR" target; fi'
  script:
    - mkdir -p target/ci/redline-testing
    - 'curl -fsSL "$CI_REDLINE_TESTING_URL" -o target/ci/redline-testing/redline-testing.tar.gz'
    - tar -xzf target/ci/redline-testing/redline-testing.tar.gz -C target/ci/redline-testing
    - export REDLINE_TESTING_BIN="$(find target/ci/redline-testing -maxdepth 3 -type f -name redline-testing -executable | head -1)"
    - "$REDLINE_TESTING_BIN version"
    - bash scripts/sqlite/build-reference.sh
    - export SQLITE_REF_BIN="$(pwd)/target/sqlite-reference/3.53.1/bin/sqlite3"
    - "$SQLITE_REF_BIN --version"
    - 'RUSTFLAGS="-C link-arg=-fuse-ld=mold -C target-cpu=znver2" cargo build --release --locked -p redlinedb-cli --bin redlinedb'
    - mkdir -p target/perf
    - 'set +e; "$REDLINE_TESTING_BIN" run --target-bin target/release/redlinedb --sqlite-bin "$SQLITE_REF_BIN" --suite rql_phase1 --workers 10 --tmp-root /dev/shm/redline-testing-perf-rql --repetitions 3 --warmup 1 --output target/perf/v4.0.x-rql-native-ci.jsonl; status=$?; set -e; [ -s target/perf/v4.0.x-rql-native-ci.jsonl ] || exit "$status"'
    - 'echo "== rql benchmark summary =="; ls -la target/perf/; head -20 target/perf/v4.0.x-rql-native-ci.jsonl 2>/dev/null || true'
  artifacts:
    when: always
    name: "redlinedb-rql-benchmark-evidence"
    paths:
      - target/perf/
    expire_in: 30 days
