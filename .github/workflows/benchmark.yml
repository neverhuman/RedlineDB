name: benchmark

# Native-compile benchmark suite — ported from the `benchmark` stage of
# .gitlab-ci.yml (jobs: benchmark, benchmark-rql). These were the only
# GitLab jobs with no equivalent in the existing .github/workflows/* suite.
#
# Heavy native-compile + full-corpus perf measurement. Runs scripts/perf/full.sh
# (and the redline-testing rql_phase1 suite) against the redline-testing v1.0.1
# official corpus with a target-cpu=znver2 release build of redlinedb-cli.
# The produced target/perf/*.jsonl is the canonical CI perf evidence.
#
# Trigger semantics mirror the GitLab rules:
#   - GitLab "push && main (on_success)"  -> push: branches: [main]
#   - GitLab "web (manual)"               -> workflow_dispatch
#   - GitLab "schedule (on_success)"      -> schedule
# The GitLab MR rule was `when: manual, allow_failure: true` — i.e. NOT run
# automatically on every MR (the 2-3 hr corpus run isn't an MR gate; parity
# covers regression detection). On GitHub a manual MR run is reproduced via
# workflow_dispatch, so this workflow intentionally has no `pull_request:`
# trigger — keeping the "not gated per-PR" posture.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly native benchmark refresh (mirrors GitLab schedule pipelines).
    - cron: '0 6 * * 1'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
      CI_REDLINE_TESTING_REQUESTED_VERSION: '1.0.1'
      REDLINE_TESTING_PINNED_ONLY: '1'
      CI_REDLINE_TESTING_URL: 'https://github.com/neverhuman/redline-testing/releases/download/v1.0.1/redline-testing-1.0.1-linux-x86_64.tar.gz'
      PERF_WORKERS: '10'
      PERF_ROOT: target/perf
    steps:
      # Marketplace-free checkout (no actions/checkout).
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang mold openssl sqlite3 zlib1g-dev curl ca-certificates git jq python3
      - name: Run native benchmark corpus
        run: |
          # 1. Download + extract the public redline-testing tarball directly.
          mkdir -p target/ci/redline-testing
          curl -fsSL "$CI_REDLINE_TESTING_URL" -o target/ci/redline-testing/redline-testing.tar.gz
          tar -xzf target/ci/redline-testing/redline-testing.tar.gz -C target/ci/redline-testing
          REDLINE_TESTING_BIN="$(find target/ci/redline-testing -maxdepth 3 -type f -name redline-testing -executable | head -1)"
          export REDLINE_TESTING_BIN
          "$REDLINE_TESTING_BIN" version
          # 2. Build the sqlite3 reference (3.53.1).
          bash scripts/sqlite/build-reference.sh
          SQLITE_REF_BIN="$(pwd)/target/sqlite-reference/3.53.1/bin/sqlite3"
          export SQLITE_REF_BIN
          "$SQLITE_REF_BIN" --version
          # 3. Compile RedlineDB release with explicit microarch targeting (znver2).
          RUSTFLAGS="-C link-arg=-fuse-ld=mold -C target-cpu=znver2" cargo build --release --locked -p redlinedb-cli --bin redlinedb
          sha256sum target/release/redlinedb | tee target/perf-native-binary.sha256.txt || true
          # 4. Run the full perf corpus (1127 cases x 3 reps + 1 warmup x 10 workers).
          mkdir -p target/perf
          bash scripts/perf/full.sh target/release/redlinedb v4.0.x-native-ci
          # 5. Print summary.
          echo "== benchmark summary =="
          ls -la target/perf/
          head -20 target/perf/v4.0.x-native-ci.jsonl 2>/dev/null || true
      - name: Upload native benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3 (pin matches existing ci.yml)
        with:
          name: redlinedb-native-benchmark-evidence
          if-no-files-found: ignore
          path: |
            target/perf/**
            target/perf-native-binary.sha256.txt

  benchmark-rql:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
      CI_REDLINE_TESTING_REQUESTED_VERSION: '1.0.1'
      REDLINE_TESTING_PINNED_ONLY: '1'
      CI_REDLINE_TESTING_URL: 'https://github.com/neverhuman/redline-testing/releases/download/v1.0.1/redline-testing-1.0.1-linux-x86_64.tar.gz'
      PERF_WORKERS: '10'
      PERF_ROOT: target/perf
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang mold openssl sqlite3 zlib1g-dev curl ca-certificates git jq python3
      - name: Run rql benchmark suite
        run: |
          mkdir -p target/ci/redline-testing
          curl -fsSL "$CI_REDLINE_TESTING_URL" -o target/ci/redline-testing/redline-testing.tar.gz
          tar -xzf target/ci/redline-testing/redline-testing.tar.gz -C target/ci/redline-testing
          REDLINE_TESTING_BIN="$(find target/ci/redline-testing -maxdepth 3 -type f -name redline-testing -executable | head -1)"
          export REDLINE_TESTING_BIN
          "$REDLINE_TESTING_BIN" version
          bash scripts/sqlite/build-reference.sh
          SQLITE_REF_BIN="$(pwd)/target/sqlite-reference/3.53.1/bin/sqlite3"
          export SQLITE_REF_BIN
          "$SQLITE_REF_BIN" --version
          RUSTFLAGS="-C link-arg=-fuse-ld=mold -C target-cpu=znver2" cargo build --release --locked -p redlinedb-cli --bin redlinedb
          mkdir -p target/perf
          set +e
          "$REDLINE_TESTING_BIN" run --target-bin target/release/redlinedb --sqlite-bin "$SQLITE_REF_BIN" --suite rql_phase1 --workers 10 --tmp-root /dev/shm/redline-testing-perf-rql --repetitions 3 --warmup 1 --output target/perf/v4.0.x-rql-native-ci.jsonl
          status=$?
          set -e
          [ -s target/perf/v4.0.x-rql-native-ci.jsonl ] || exit "$status"
          echo "== rql benchmark summary =="
          ls -la target/perf/
          head -20 target/perf/v4.0.x-rql-native-ci.jsonl 2>/dev/null || true
      - name: Upload rql benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3 (pin matches existing ci.yml)
        with:
          name: redlinedb-rql-benchmark-evidence
          if-no-files-found: ignore
          path: |
            target/perf/**
