name: sqlite-parity-report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: sqlite-parity-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ secrets.REDLINEDB_REPORT_BOT_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mold sqlite3
      - name: Publish report PR
        env:
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.REDLINEDB_REPORT_BOT_TOKEN || github.token }}
        run: bash scripts/just/run.sh sqlite-parity-report-publish-pr
