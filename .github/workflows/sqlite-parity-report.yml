name: redline-testing-report

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

concurrency:
  group: redline-testing-report
  cancel-in-progress: false

jobs:
  publish-pr:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          cargo_target="${RUNNER_TOOL_CACHE}/redlinedb-target"
          mkdir -p "${cargo_home}/bin" "${cargo_target}"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_DIR=${cargo_target}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential mold openssl sqlite3 zlib1g-dev
      - run: bash ops/ci/install-github-tools.sh
      - name: Publish generated SQLite parity report PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
        run: bash ops/ci/sqlite-parity-report.sh publish-pr
