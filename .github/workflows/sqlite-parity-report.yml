name: sqlite-parity-report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: sqlite-parity-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mold sqlite3
      - name: Generate report update
        run: bash scripts/just/run.sh sqlite-parity-report-update
      - name: Build binary patch artifact
        run: |
          git diff --binary > sqlite-parity-report.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqlite-parity-report-patch
          path: sqlite-parity-report.patch
          if-no-files-found: error
