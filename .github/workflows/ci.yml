name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      # Thin dispatcher: all fast-lane logic lives in ops/ci/fast.sh so
      # CI and local (`scripts/ci-local.sh fast`, `just fast`, the
      # ops/git-hooks/pre-push hook) run the same four commands. Audit
      # reference: HLT-038 ci.local-parity.lib-missing.
      - run: bash ops/ci/fast.sh
