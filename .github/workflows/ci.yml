name: ci

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: v4.1.0-rc.2
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CARGO_HOME is exported from $RUNNER_TOOL_CACHE in the unlock step
# (workflow-level runner context is unavailable and rejects the file).
# Leave CARGO_TARGET_DIR unset so cargo and scripts share $PWD/target;
# artifact uploads and parity look for target/release and target/redline-testing.

jobs:
  preflight:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      # v4.2.2 uses direct local git auth config. The newer pinned checkout
      # SHA intermittently failed before lane logic while fetching PR merge refs.
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null; then
            curl -LsSf https://get.nexte.st/0.9.133/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          fi
      # Thin dispatcher: all fast-lane logic lives in ops/ci/fast.sh so
      # CI and local (`scripts/ci-local.sh fast`, `just fast`, the
      # pre-push gate) run the same command set. The preflight stage is
      # isolated here and the test shards fan out below so no single job
      # exceeds the GitHub timeout.
      - run: CI_FAST_STAGE=preflight bash ops/ci/fast.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        stage:
          - core
          - kernel
          - sql-unit
          - sql-contracts
          - bench
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null; then
            curl -LsSf https://get.nexte.st/0.9.133/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          fi
      - name: Run fast test shard
        env:
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
        run: CI_FAST_STAGE=${{ matrix.stage }} bash ops/ci/fast.sh
  parity:
    strategy:
      fail-fast: false
      matrix:
        stage:
          - redline-testing-official
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Run parity shard
        env:
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: CI_PARITY_STAGE=${{ matrix.stage }} bash ops/ci/parity.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: redline-testing-official-evidence
          if-no-files-found: ignore
          path: |
            target/redline-testing/**

  official-evidence-guard:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - name: Guard official evidence boundary
        run: bash scripts/guard-official-evidence.sh

  # Branch ruleset requires these exact job names. They run real engine
  # work and must not wait on the official parity shard.
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Engine unit tests
        run: |
          cargo test --locked --workspace --lib
          cargo test --locked -p redlinedb-cli

  build:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Release-build redlinedb-cli
        run: cargo build --locked --release -p redlinedb-cli

  lint:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --check

  typecheck:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Workspace typecheck
        run: cargo check --workspace --locked

  cli:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          bash ops/ci/apt-install.sh build-essential pkg-config openssl sqlite3 zlib1g-dev
      - name: Release-build CLI package
        run: cargo build --locked --release -p redlinedb-cli

  components:
    strategy:
      fail-fast: false
      matrix:
        lane: [testing, central, web, release-tools, integration]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: {toolchain: 1.95.0, components: rustfmt}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with: {key: '${{ matrix.lane }}'}
      - run: bash ops/ci/apt-install.sh pkg-config sqlite3
      - run: bash scripts/ci-family.sh "${{ matrix.lane }}"

  audit:
    needs: security
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - run: bash ops/ci/install-github-tools.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: security-evidence, path: target/jankurai/security}
      - name: Audit engine against the accepted baseline
        run: jankurai audit . --full --mode ratchet --baseline .jankurai/baselines/github-monorepo.repo-score.json --json target/audit-family/engine/repo-score.json --md target/audit-family/engine/repo-score.md --no-score-history --policy agent/audit-policy.toml
      - run: bash ops/ci/audit-family.sh components
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: audit-family, path: target/audit-family, if-no-files-found: error}

  security:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - name: Unlock leftover workspace files
        run: |
          set +e
          if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            chmod -R u+rwx "${GITHUB_WORKSPACE}"
          fi
          cargo_home="${RUNNER_TOOL_CACHE}/redlinedb-cargo"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
          echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
          exit 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: {toolchain: 1.95.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo install cargo-deny --locked --version 0.19.8
      - run: bash ops/ci/install-github-tools.sh
      - run: |
          jankurai security run . --strict --profile ci --script ops/ci/security-family.sh --out target/jankurai/security/evidence.json || {
            cat target/jankurai/security/security-lane-*.log
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: security-evidence, path: target/jankurai/security, if-no-files-found: error}

  packaging:
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ inputs.tag || 'v4.1.0-rc.2' }}
    permissions:
      contents: read

  required:
    name: RedlineDB/required
    if: always()
    needs: [preflight, tests, parity, official-evidence-guard, test, build, lint, typecheck, cli, components, audit, security, packaging]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | length > 0 and all(.value.result == "success")'
