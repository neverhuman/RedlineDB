name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Run local CI mirror
        run: scripts/ci-local.sh pr-ci

  # Jankurai-badge lane: extracts the numeric score from agent/repo-score.json,
  # updates the <!-- jankurai-score-badge:begin/end --> section in README.md,
  # and commits it back to main. Runs only on push to main so PRs from forks
  # never need contents:write. The [skip ci] annotation prevents a loop.
  jankurai-badge:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: pr-ci
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job commits the score badge back to main, so it legitimately needs
      # the checkout credentials persisted to push.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Update jankurai score badge in README
        # agent/jankurai-badge.json is the tracked source of truth for the
        # jankurai score. When a developer updates the score (after re-running
        # jankurai), this step syncs the README badge to match. The badge JSON
        # format: .message = "38/100 advisory", .color = "red"|"orange"|etc.
        run: cargo run --locked --quiet -p xtask -- update-badge
      - name: Commit badge update if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "Badge unchanged — nothing to commit"
          else
            git add README.md
            git commit -m "chore(badge): update jankurai score badge [skip ci]"
            git push
          fi

  # Beyond-postgres-reference lane: validates corpus/beyond_sqlite cases by
  # running each through psql ↔ psql self-compare. Gated to push/dispatch
  # (and the `exhaustive` branch) so PRs from forks don't have to provision
  # Postgres. The release workflow does NOT include this job — release
  # artifacts are produced from the no-Postgres fast lane only, preserving
  # the "sqlite_parity passes without Postgres" invariant.
  beyond-postgres:
    if: |
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/exhaustive'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          # Bind to loopback only — the beyond-postgres CI job is internal;
          # publishing 5432 on 0.0.0.0 would let other workflow services
          # reach the test database.
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run beyond-SQLite oracle
        env:
          REDLINE_TESTING_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          cargo test --locked --test beyond_sqlite_smoke
          # The full `--suite beyond_sqlite` run sees Postgres via the env
          # var and exercises the oracle path. The legacy manifest-only path
          # continues to emit a feature record per features.json entry.
          cargo build --release --locked
          mkdir -p /tmp/redline-out
          ./target/release/redline-testing run \
            --suite beyond_sqlite \
            --target-bin sqlite3 \
            --output /tmp/redline-out/beyond.jsonl \
            --memory-samples
          echo "Beyond-SQLite oracle output (head):"
          head -50 /tmp/redline-out/beyond.jsonl
      - name: Upload beyond-SQLite raw output
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: beyond-sqlite-jsonl
          path: /tmp/redline-out/beyond.jsonl
          if-no-files-found: ignore

  # Security lane: secret scanning + dependency review + workflow linting.
  # Blocking on the default branch / PRs; mirrors `bash ops/ci/security.sh`
  # so local == CI.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Install security tools
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
      - name: "Security scan: gitleaks detect, cargo audit, cargo deny, zizmor, syft"
        env:
          REDLINE_STRICT_TOOLS: "1"
        run: bash ops/ci/security.sh

  # Jankurai tool-suite lane: runs the adopted jankurai tools and uploads their
  # evidence artifacts. The CI evidence catalog records the exact commands so
  # the audit can verify tool adoption. The lane fails closed unless the local
  # release runner supplies the exact governed Jankurai identity.
  jankurai:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Run jankurai tool suite
        run: bash ops/ci/jankurai.sh
      - name: Jankurai CI evidence catalog
        run: |
          mkdir -p target/jankurai
          cat > target/jankurai/ci-evidence-catalog.txt <<'EOF'
          jankurai audit . --mode ratchet --baseline target/jankurai/accepted-baseline.json --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md
          jankurai proof . --changed-from origin/main --out target/jankurai/proof-routing.json --md target/jankurai/proof-routing.md
          jankurai proofbind verify . --changed-from origin/main
          jankurai proofmark rust . --obligations target/jankurai/proofbind/obligations.json
          jankurai copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md
          jankurai security run . --strict --profile ci --script ops/ci/security.sh --out target/jankurai/security/evidence.json
          gitleaks detect --source . --config gitleaks.toml --no-banner --redact --no-git
          cargo audit --db "${CARGO_HOME}/advisory-db" --no-fetch
          cargo deny check
          npm audit --audit-level=high
          zizmor .github/workflows
          SYFT_CHECK_FOR_APP_UPDATE=false syft dir:. -o spdx-json=target/security/redline-testing.spdx.json
          jankurai ci-bad-behavior . --out target/jankurai/language-bad-behavior.log
          jankurai git-bad-behavior . --out target/jankurai/language-bad-behavior.log
          jankurai release-bad-behavior . --out target/jankurai/language-bad-behavior.log
          jankurai contract-drift . --out target/jankurai/contract-drift.json
          jankurai rust witness build .
          jankurai authz-matrix . --out target/jankurai/authz-matrix.json
          jankurai input-boundary . --out target/jankurai/input-boundary.json
          jankurai agent-tool-supply . --out target/jankurai/agent-tool-supply.json
          jankurai release-readiness . --out target/jankurai/release-readiness.json
          jankurai cost-budget . --out target/jankurai/cost-budget.json
          EOF
      - name: Upload jankurai evidence artifacts
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: jankurai-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/copy-code.json
            target/jankurai/copy-code.md
            target/jankurai/security/evidence.json
            target/jankurai/language-bad-behavior.log
            target/jankurai/rust/witness-graph.json
            target/jankurai/cost-budget.json
            target/jankurai/release-readiness.json
            target/jankurai/ci-evidence-catalog.txt
