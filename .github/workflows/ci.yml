name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      # v4.2.2 uses direct local git auth config. The newer pinned checkout
      # SHA intermittently failed before lane logic while fetching PR merge refs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mold openssl sqlite3 zlib1g-dev
      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/0.9.133/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      # Thin dispatcher: all fast-lane logic lives in ops/ci/fast.sh so
      # CI and local (`scripts/ci-local.sh fast`, `just fast`, the
      # pre-push gate) run the same command set. The preflight stage is
      # isolated here and the test shards fan out below so no single job
      # exceeds the GitHub timeout.
      - run: CI_FAST_STAGE=preflight bash ops/ci/fast.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        stage:
          - core
          - kernel
          - sql-unit
          - sql-contracts
          - bench
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mold openssl sqlite3 zlib1g-dev
      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/0.9.133/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - name: Run fast test shard
        env:
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
        run: CI_FAST_STAGE=${{ matrix.stage }} bash ops/ci/fast.sh

  parity:
    strategy:
      fail-fast: false
      matrix:
        stage:
          - redline-testing-official
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mold openssl sqlite3 zlib1g-dev
      - name: Run parity shard
        env:
          REDLINEDB_BENCH_GIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          # Pin to the redline-testing release that ships target capability
          # gating (skips SQL_VIRTUAL_TABLE_OPTIONAL cases 93–96 against
          # engines without fts5/rtree/dbstat) and the PINNED_ONLY env so
          # the run sticks to the 1127-case pinned upstream manifest.
          CI_REDLINE_TESTING_REQUESTED_VERSION: "0.1.3"
          REDLINE_TESTING_PINNED_ONLY: "1"
        run: CI_PARITY_STAGE=${{ matrix.stage }} bash ops/ci/parity.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: redline-testing-official-evidence
          if-no-files-found: ignore
          path: |
            target/redline-testing/**

  official-evidence-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - name: Guard official evidence boundary
        run: bash scripts/guard-official-evidence.sh

  metrics-readme:
    needs: [parity]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # For pull_request events, github.ref is refs/pull/N/merge (the
          # merge commit) — checking that out and pushing HEAD back to the
          # branch would overwrite the PR with the merge commit. Use
          # github.head_ref (the actual PR branch name) when available so
          # the workspace is on the real branch tip and a subsequent
          # `git push` updates the branch cleanly.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install tokei
        run: cargo install tokei --locked --version 14.0.0
      - name: Download parity evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: redline-testing-official-evidence
          path: target/redline-testing
      - name: Build SQLite reference (for LOC comparison)
        run: bash scripts/sqlite/build-reference.sh
      - name: Refresh jankurai score
        run: bash ops/ci/jankurai-tools.sh audit-ci
      - name: Regenerate README metrics section
        run: bash scripts/generate-metrics-readme.sh
      - name: Auto-commit refreshed README
        # Always commits — measured numbers naturally drift between runs,
        # so a strict verify-on-PR step would never pass. The `[skip ci]`
        # tag in the commit message blocks an infinite CI loop.
        run: |
          if git diff --quiet README.md; then
            echo "README.md already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          branch_ref="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          msg="docs(readme): auto-refresh metrics for ${GITHUB_SHA:0:8} [skip ci]"
          git commit -m "$msg"
          if ! git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${branch_ref}"; then
            echo "::warning::could not push refreshed README to ${branch_ref} — likely branch protection on ${branch_ref}. README artifact still attached below."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload refreshed README artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refreshed-readme
          path: README.md

  # The branch ruleset requires checks named test/build/lint/typecheck/cli.
  # The aggregate test relay emits the required `test` context, while the
  # other relay jobs propagate the aggregate result under their required
  # names without duplicating the build.
  test:
    needs: [preflight, tests, parity, official-evidence-guard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.preflight.result }}" = "success"
      - run: test "${{ needs.tests.result }}" = "success"
      - run: test "${{ needs.parity.result }}" = "success"
      - run: test "${{ needs['official-evidence-guard'].result }}" = "success"

  build:
    needs: [preflight, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.preflight.result }}" = "success"
      - run: test "${{ needs.test.result }}" = "success"

  lint:
    needs: [preflight, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.preflight.result }}" = "success"
      - run: test "${{ needs.test.result }}" = "success"

  typecheck:
    needs: [preflight, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.preflight.result }}" = "success"
      - run: test "${{ needs.test.result }}" = "success"

  cli:
    needs: [preflight, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.preflight.result }}" = "success"
      - run: test "${{ needs.test.result }}" = "success"
