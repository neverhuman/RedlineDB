name: packages
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux-x86_64}
          - {os: ubuntu-22.04-arm, platform: linux-arm64}
          - {os: macos-15-intel, platform: macos-x86_64}
          - {os: macos-15, platform: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: {toolchain: 1.95.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Package all distributions
        env: {TAG: '${{ inputs.tag }}'}
        run: bash ops/ci/packages.sh build
      - run: bash ops/ci/packages.sh smoke
      - run: bash ops/ci/packages.sh installer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-${{ matrix.platform }}
          path: target/packages/*
          if-no-files-found: error
  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux-x86_64}
          - {os: ubuntu-22.04-arm, platform: linux-arm64}
          - {os: macos-15-intel, platform: macos-x86_64}
          - {os: macos-15, platform: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'packages-${{ matrix.platform }}', path: target/packages}
      - name: Run archives in a fresh runner without building
        run: bash ops/ci/packages.sh runtime
