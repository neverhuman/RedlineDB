name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"   # weekly on Monday

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: security lane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          ver=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (gitleaks detect)
        run: gitleaks detect --no-banner --redact --source .

      - name: Security lane (ops/ci/security.sh)
        env:
          REDLINE_STRICT_TOOLS: "1"
        run: bash ops/ci/security.sh
