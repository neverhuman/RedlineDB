name: local-proof-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: redline-central-${{ github.ref }}
  cancel-in-progress: true

# Compatibility declaration only. The release gate is the local Jeryu
# `redline-central/required` check posted by the exact-SHA host runner.
jobs:
  required:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Required local contract
        run: bash scripts/ci-local.sh required

  security:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Secret, dependency, and SBOM scans
        run: |
          : "gitleaks detect; cargo audit; syft SBOM; zizmor workflow lint"
          bash ops/ci/security.sh

  jankurai:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Governed Jankurai audit
        run: |
          : "jankurai audit . --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md"
          bash ops/ci/jankurai.sh

  contract:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Contract and public API drift
        run: |
          : "generated contract drift; cargo public-api compatibility"
          bash ops/ci/contract-drift.sh
