name: redline-hub-jankurai-static-mirror

on:
  pull_request:
  push:
    branches: [main]

# This public workflow is a non-authoritative structural mirror. The release
# gate runs only on the local Jeryu fleet, which injects the protected-main,
# root-owned Jankurai binary into an isolated exact-head sandbox.
permissions:
  contents: read

concurrency:
  group: redline-hub-jankurai-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Validate non-authoritative mirror contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Reject release-authority drift
        run: bash ops/ci/github-mirror-contract.sh
