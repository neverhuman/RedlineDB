name: jankurai
on:
  workflow_dispatch:
concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash ops/ci/audit-family.sh
