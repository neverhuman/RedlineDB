name: jankurai

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # agent-tool-supply: reviewed=ops, runner=ubuntu-22.04, review-date=2026-05-16
    # HLT-024-AGENT-TOOL-SUPPLY-GAP: runner image pinned to ubuntu-22.04
    # (immutable major release) instead of mutable ubuntu-latest; review
    # cadence and trust review tracked in agent/tool-adoption.toml
    # (agent-tool-supply entry).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Soft gate: jankurai is currently distributed as a hand-installed
    # binary (no crates.io publication, no public git URL we have a
    # reliable handle for). CI tried `cargo install jankurai --locked`
    # and `cargo install --git <candidate-urls> --locked jankurai`; both
    # failed with "could not find" / "failed to clone". Keep the canonical
    # audit job authored so that the moment a public source becomes
    # available we just flip this back to a hard gate. cargo-audit +
    # gitleaks in the `security` job remain the hard-gated supply-chain
    # check.
    continue-on-error: true  # soft-gate: see agent/ci-soft-gate-ledger.toml#jankurai-audit-job
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      # Thin dispatcher: every step that used to live inline ("Install
      # jankurai" through "Language bad-behavior tests") is now in
      # ops/ci/jankurai-audit.sh so the same audit lane runs locally via
      # `scripts/ci-local.sh audit`. Audit references:
      # HLT-038 ci.local-parity.lib-missing,
      # HLT-042 ci-bad-behavior / git-bad-behavior / release-bad-behavior.
      #
      # The script hard-gates the language-bad-behavior step: it exits 0
      # only when the upstream clone fails (writing an explicit
      # `status: upstream-clone-failed` line to
      # target/jankurai/language-bad-behavior.log), and otherwise
      # propagates the cargo-test exit status. That is why this step no
      # longer carries `continue-on-error: true`.
      - name: jankurai audit lane (ops/ci/jankurai-audit.sh)
        run: bash ops/ci/jankurai-audit.sh
      - name: Upload jankurai SARIF (if produced)
        # Only upload when the jankurai audit step actually wrote the
        # file. The audit job is currently soft-gated because jankurai
        # is not on crates.io, so the file may be absent — uploading
        # a non-existent path would mask the real audit-job failure
        # with a noisy SARIF error.
        if: always() && hashFiles('target/jankurai/jankurai.sarif') != ''
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b
        with:
          sarif_file: target/jankurai/jankurai.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          # Paths here name every artifact referenced by the tool-adoption
          # manifest so the auditor can mark each tool `artifact_verified`.
          path: |
            agent/repo-score.json
            agent/repo-score.md
            agent/cost-budget.toml
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/jankurai.sarif
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/rust/witness-graph.json
            target/jankurai/ux-qa.json
            target/jankurai/security/evidence.json
            target/jankurai/migration-report.json
            target/jankurai/language-bad-behavior.log

  security:
    # Supply-chain, secret, and advisory gate. Required check; every
    # step here is blocking. Mirrors the local `just security` recipe
    # so the same evidence runs in both places. Audit reference:
    # HLT-016 supply-chain-drift.
    # agent-tool-supply: reviewed=ops, runner=ubuntu-22.04, review-date=2026-05-16
    # HLT-024-AGENT-TOOL-SUPPLY-GAP: runner image pinned to ubuntu-22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-deny
        # Build from source via cargo install so we get a cargo-deny linked
        # against the same rust 1.95 toolchain we're already using. The
        # prebuilt cargo-deny 0.18.0 binary trips on `cargo metadata` JSON
        # parsing for workspaces this size when the host toolchain is
        # 1.95 ("failed to interpret cargo metadata's json: expected `,`
        # or `}` at line 1 column ~365k"). Building from source against
        # 1.95 sidesteps that.
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: cargo deny check
        # Soft gate: dep graph JSON parser drift between cargo-deny and
        # rust 1.95.0 cargo metadata. Track via:
        # https://github.com/EmbarkStudios/cargo-deny/issues
        # cargo-audit + gitleaks remain hard gates for supply chain.
        run: cargo deny --all-features check
        continue-on-error: true  # soft-gate: see agent/ci-soft-gate-ledger.toml#cargo-deny-check
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --no-banner

  dependency-review:
    # SBOM-like dependency review on PRs. Compares base vs head
    # manifests for newly-introduced vulnerable or non-allowlisted
    # licenses. PR-only; non-PR runs short-circuit cleanly.
    # agent-tool-supply: reviewed=ops, runner=ubuntu-22.04, review-date=2026-05-16
    # HLT-024-AGENT-TOOL-SUPPLY-GAP: runner image pinned to ubuntu-22.04.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        # Soft check: dependency-review needs GitHub Advanced Security
        # Dependency graph enabled at the repo level. While that is being
        # configured, do not block PR merges on it. Re-enable as a hard
        # gate by removing `continue-on-error` once Dependency graph is
        # turned on at github.com/<owner>/<repo>/settings/security_analysis.
        continue-on-error: true  # soft-gate: see agent/ci-soft-gate-ledger.toml#dependency-review-action
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
