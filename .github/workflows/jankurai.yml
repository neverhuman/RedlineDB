name: jankurai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jankurai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Ensure PR branch contains origin/main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "PR branch is behind origin/main. Rebase or merge main before committing."
            exit 1
          fi

  audit:
    # Inline jankurai tool-adoption CI evidence steps. Each `run: jankurai
    # ...` step is the canonical CI evidence entry for its tool-adoption
    # manifest row (see .jankurai/tool-adoption.toml). The local Jeryu fleet
    # injects the governed binary pinned in ops/ci/lib.sh; this mirror never
    # installs or fetches Jankurai source.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.8
      - name: Install gitleaks
        run: |
          set -euo pipefail
          source ops/ci/lib.sh
          ci_install_gitleaks
      - name: Install actionlint (workflow linter)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
      - name: Install syft (SBOM generator)
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin syft
      - name: Prepare accepted baseline
        run: |
          set -euo pipefail
          mkdir -p .jankurai target/jankurai
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            if git show origin/main:.jankurai/baselines/main.repo-score.json > .jankurai/accepted-baseline.json 2>/dev/null; then
              echo "baseline sourced from origin/main"
            elif [ -f .jankurai/baselines/main.repo-score.json ]; then
              cp .jankurai/baselines/main.repo-score.json .jankurai/accepted-baseline.json
              echo "baseline sourced from local (first-time commit)"
            else
              echo "missing accepted baseline .jankurai/baselines/main.repo-score.json" >&2
              exit 1
            fi
          elif [ -f .jankurai/baselines/main.repo-score.json ]; then
            cp .jankurai/baselines/main.repo-score.json .jankurai/accepted-baseline.json
          else
            echo "missing accepted baseline .jankurai/baselines/main.repo-score.json" >&2
            exit 1
          fi
          cp .jankurai/accepted-baseline.json target/jankurai/accepted-baseline.json
      - name: Verify governed jankurai
        run: |
          set -euo pipefail
          source ops/ci/lib.sh
          mkdir -p target/jankurai
          ci_install_jankurai_logged target/jankurai/governed-jankurai.log
      - name: Check audit policy mirror
        run: bash scripts/check_audit_policy_mirror.sh
      - name: Tool-adoption command index
        run: |
          printf '%s\n' \
            'jankurai audit . --mode ratchet --baseline target/jankurai/accepted-baseline.json --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md --no-score-history --policy agent/audit-policy.toml' \
            'jankurai proofbind verify . --changed-from origin/main' \
            'jankurai proofmark rust . --obligations target/jankurai/proofbind/obligations.json' \
            'jankurai copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md' \
            'jankurai security run . --out target/jankurai/security/evidence.json' \
            'bash ops/ci/governed-jankurai-test.sh' \
            'jankurai rust witness build .'
      - run: jankurai --version
      - name: Proofbind verify
        run: |
          set -euo pipefail
          changed=()
          while IFS= read -r -d '' path; do
            changed+=(--changed "$path")
          done < <(git diff --name-only -z --diff-filter=ACMRT origin/main...HEAD --)
          jankurai proofbind verify . "${changed[@]}"
      - name: Proofmark rust
        run: jankurai proofmark rust . --obligations target/jankurai/proofbind/obligations.json
      - name: Rust witness build
        run: jankurai rust witness build .
      - name: Security lane
        run: jankurai security run . --strict --profile ci --out target/jankurai/security/evidence.json
      - name: Copy-code audit
        run: jankurai copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md
      - name: Governed Jankurai hostile probes
        run: bash ops/ci/governed-jankurai-test.sh
      - name: jankurai staged-gate (PR changed files)
        # Mirrors tools/jankurai-hooks/pre-commit but compares against the
        # PR merge base. Blocks the lane on any new hard finding so PRs
        # cannot land changes that JANKURAI_SKIP_HOOKS=1 let through
        # locally.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/main
        run: bash ops/ci/jankurai-staged-gate.sh
      - name: jankurai audit
        run: jankurai audit . --mode ratchet --baseline target/jankurai/accepted-baseline.json --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md --sarif target/jankurai/jankurai.sarif --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl --no-score-history --policy agent/audit-policy.toml
      - name: Filter generated-zone SARIF findings
        if: hashFiles('target/jankurai/jankurai.sarif') != ''
        run: bash ops/ci/filter-generated-sarif.sh target/jankurai/jankurai.sarif
      - name: Upload jankurai SARIF (if produced)
        if: always() && hashFiles('target/jankurai/jankurai.sarif') != ''
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b
        with:
          sarif_file: target/jankurai/jankurai.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            .jankurai/cost-budget.toml
            .jankurai/baselines/main.repo-score.json
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            .jankurai/jankurai.sarif
            .jankurai/repair-queue.jsonl
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            agent/repo-score.json
            agent/repo-score.md
            target/jankurai/jankurai.sarif
            target/jankurai/repair-queue.jsonl
            .jankurai/proofbind/obligations.json
            .jankurai/proofbind/surface-witness.json
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofbind/surface-witness.json
            .jankurai/proofmark/proofmark-receipt.json
            .jankurai/proofmark/proof-receipt.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofmark/proof-receipt.json
            .jankurai/rust/witness-graph.json
            target/jankurai/rust/witness-graph.json
            .jankurai/copy-code.json
            .jankurai/copy-code.md
            target/jankurai/copy-code.json
            target/jankurai/copy-code.md
            .jankurai/security/evidence.json
            target/jankurai/security/evidence.json
            .jankurai/migration-report.json
            target/jankurai/governed-jankurai.log
            target/jankurai/governed-jankurai-test.log

  security:
    # Hard gate end-to-end. Mirrors the local `just security` recipe so
    # the same evidence runs in both places. Audit reference:
    # HLT-016 supply-chain-drift, HLT-034 ci-bad-behavior.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.8
      - name: Install gitleaks
        run: |
          set -euo pipefail
          source ops/ci/lib.sh
          ci_install_gitleaks
      - name: Install actionlint (workflow linter)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
      - name: Install syft (SBOM generator)
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin syft
      # Thin dispatcher: all supply-chain logic lives in ops/ci/security.sh
      # so CI and local (`scripts/ci-local.sh security`, `just security`)
      # run identical hard-gated commands and preserve their evidence logs.
      - name: security lane (ops/ci/security.sh)
        run: bash ops/ci/security.sh

  dependency-review:
    # Reproducible full-graph dependency review on PRs. Rejects vulnerable,
    # banned, non-allowlisted, or untrusted dependencies under deny.toml.
    #
    # Hard gate end-to-end through the reproducible cargo-deny equivalent.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.8
      - name: dependency-review lane (ops/ci/dependency-review.sh)
        run: bash ops/ci/dependency-review.sh
