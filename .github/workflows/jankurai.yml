name: jankurai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: 1.25.5
          cache: false
      - name: Restore pinned tool and build caches
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            ~/go/pkg/mod
            ~/.cache/go-build
            target
          key: security-tools-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq just shellcheck
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.8
          cargo install --locked zizmor --version 1.25.2
          install -d "$HOME/.local/bin"
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          GOBIN="$HOME/.local/bin" go install github.com/gitleaks/gitleaks/v8@v8.21.2
          GOBIN="$HOME/.local/bin" go install github.com/anchore/syft/cmd/syft@v1.40.0
          GOBIN="$HOME/.local/bin" go install github.com/anchore/grype/cmd/grype@v0.99.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fast lane
        run: bash ops/ci/fast.sh
      - name: Required lane
        run: bash ops/ci/required.sh
      - name: Security lane (actionlint, zizmor, dependency, SBOM, and secret scans)
        run: bash ops/ci/security.sh
      - name: Score lane
        run: bash ops/ci/score.sh
      - name: Tool adoption lane
        run: bash ops/ci/tool-adoption.sh
      - name: Contract drift lane
        run: bash ops/ci/contract-drift.sh
      - name: Artifact support
        run: bash ops/ci/artifact_support.sh
