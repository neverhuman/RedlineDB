name: jankurai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jankurai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Ensure PR branch contains latest origin/main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "PR branch is behind origin/main. Rebase or merge main before committing."
            exit 1
          fi

  audit:
    # Inline jankurai tool-adoption CI evidence steps. Each `run: jankurai
    # ...` step is the canonical CI evidence entry for its tool-adoption
    # manifest row (see .jankurai/tool-adoption.toml). jankurai is installed
    # from the pinned v1.5.1 release binary in ops/ci/lib.sh and is a hard
    # dependency for this job.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Install actionlint (workflow linter)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
      - name: Install syft (SBOM generator)
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin syft
      - name: Prepare accepted baseline
        run: |
          set -euo pipefail
          mkdir -p .jankurai
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            if git show origin/main:.jankurai/baselines/main.repo-score.json > .jankurai/accepted-baseline.json 2>/dev/null; then
              echo "baseline sourced from origin/main"
            elif [ -f .jankurai/baselines/main.repo-score.json ]; then
              cp .jankurai/baselines/main.repo-score.json .jankurai/accepted-baseline.json
              echo "baseline sourced from local (first-time commit)"
            else
              echo "missing accepted baseline .jankurai/baselines/main.repo-score.json" >&2
              exit 1
            fi
          elif [ -f .jankurai/baselines/main.repo-score.json ]; then
            cp .jankurai/baselines/main.repo-score.json .jankurai/accepted-baseline.json
          else
            echo "missing accepted baseline .jankurai/baselines/main.repo-score.json" >&2
            exit 1
          fi
      - name: Install jankurai
        run: |
          set -euo pipefail
          source ops/ci/lib.sh
          mkdir -p .jankurai
          ci_install_jankurai_logged .jankurai/jankurai-install.log
      - run: jankurai --version
      - name: Proofbind verify
        run: jankurai proofbind verify . --changed-from origin/main
      - name: Proofmark rust
        run: jankurai proofmark rust . --obligations .jankurai/proofbind/obligations.json
      - name: Rust witness build
        run: jankurai rust witness build .
      - name: Security lane
        run: jankurai security run . --strict --profile ci --out .jankurai/security/evidence.json
      - name: Copy-code audit
        run: jankurai copy-code . --json .jankurai/copy-code.json --md .jankurai/copy-code.md
      - name: Language bad-behavior tests
        run: |
          rm -rf .jankurai/jankurai-src
          if git clone --depth 1 https://github.com/jeppsontaylor/Jankurai.git .jankurai/jankurai-src 2>/dev/null; then
            ( cd .jankurai/jankurai-src && cargo test -p jankurai --test language_bad_behavior --no-fail-fast ) \
              > >(tee .jankurai/language-bad-behavior.log) 2>&1
          else
            printf 'attempted: cargo test -p jankurai --test language_bad_behavior\nstatus: upstream-clone-failed\nsoft-gate=jankurai-language-bad-behavior ledger=.jankurai/ci-soft-gate-ledger.toml\n' \
              | tee .jankurai/language-bad-behavior.log
          fi
      - name: jankurai staged-gate (PR changed files)
        # Mirrors tools/jankurai-hooks/pre-commit but compares against the
        # PR merge base. Blocks the lane on any new hard finding so PRs
        # cannot land changes that JANKURAI_SKIP_HOOKS=1 let through
        # locally.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/main
        run: bash ops/ci/jankurai-staged-gate.sh
      - name: jankurai audit
        run: jankurai audit . --policy .jankurai/audit-policy.toml --mode advisory --json .jankurai/repo-score.json --md .jankurai/repo-score.md --sarif .jankurai/jankurai.sarif --github-step-summary .jankurai/summary.md --repair-queue-jsonl .jankurai/repair-queue.jsonl
      - name: Filter generated-zone SARIF findings
        if: hashFiles('.jankurai/jankurai.sarif') != ''
        run: python3 ops/ci/filter-generated-sarif.py .jankurai/jankurai.sarif
      - name: Upload jankurai SARIF (if produced)
        if: always() && hashFiles('.jankurai/jankurai.sarif') != ''
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b
        with:
          sarif_file: .jankurai/jankurai.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            .jankurai/cost-budget.toml
            .jankurai/baselines/main.repo-score.json
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            .jankurai/jankurai.sarif
            .jankurai/repair-queue.jsonl
            .jankurai/proofbind/obligations.json
            .jankurai/proofbind/surface-witness.json
            .jankurai/proofmark/proofmark-receipt.json
            .jankurai/proofmark/proof-receipt.json
            .jankurai/rust/witness-graph.json
            .jankurai/copy-code.json
            .jankurai/copy-code.md
            .jankurai/security/evidence.json
            .jankurai/migration-report.json
            .jankurai/language-bad-behavior.log
            .jankurai/jankurai-install.log

  security:
    # Hard gate end-to-end. Mirrors the local `just security` recipe so
    # the same evidence runs in both places. Audit reference:
    # HLT-016 supply-chain-drift, HLT-034 ci-bad-behavior.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Install actionlint (workflow linter)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
      - name: Install syft (SBOM generator)
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin syft
      # Thin dispatcher: all supply-chain logic lives in ops/ci/security.sh
      # so CI and local (`scripts/ci-local.sh security`, `just security`)
      # run identical commands. Cargo-deny is soft-gated INSIDE the script
      # (see .jankurai/ci-soft-gate-ledger.toml#cargo-deny-check); cargo-audit
      # and gitleaks remain hard gates. actionlint and syft are soft-gated
      # (see ledger entries actionlint-workflow-lint, syft-sbom).
      - name: security lane (ops/ci/security.sh)
        run: bash ops/ci/security.sh

  dependency-review:
    # SBOM-like dependency review on PRs. Compares base vs head
    # manifests for newly-introduced vulnerable or non-allowlisted
    # licenses. PR-only; non-PR runs short-circuit cleanly.
    #
    # Hard gate end-to-end. The dependency-review action itself stays in
    # the workflow YAML (it can only execute inside Actions), but its
    # exit is intercepted by ops/ci/dependency-review.sh which decides
    # whether to fail the lane. The workflow step always runs the
    # script, and the soft-gate semantics live there (see
    # .jankurai/ci-soft-gate-ledger.toml#dependency-review-action).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: dependency-review lane (ops/ci/dependency-review.sh)
        run: bash ops/ci/dependency-review.sh
