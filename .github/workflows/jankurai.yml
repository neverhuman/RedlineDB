name: jankurai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jankurai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Inline jankurai tool-adoption CI evidence steps. Each `run: jankurai
    # ...` step is the canonical CI evidence entry for its tool-adoption
    # manifest row (see agent/tool-adoption.toml). Install is soft-gated:
    # if jankurai cannot be installed, downstream jankurai steps are
    # skipped via the `installed` output check; the job still exits 0
    # without `continue-on-error: true` (HLT-034). Soft-gate reasoning is
    # recorded in agent/ci-soft-gate-ledger.toml#jankurai-install.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare accepted baseline
        run: |
          set -euo pipefail
          mkdir -p target/jankurai
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            if git show origin/main:agent/baselines/main.repo-score.json > target/jankurai/accepted-baseline.json 2>/dev/null; then
              echo "baseline sourced from origin/main"
            elif [ -f agent/baselines/main.repo-score.json ]; then
              cp agent/baselines/main.repo-score.json target/jankurai/accepted-baseline.json
              echo "baseline sourced from local (first-time commit)"
            else
              echo "missing accepted baseline agent/baselines/main.repo-score.json" >&2
              exit 1
            fi
          elif [ -f agent/baselines/main.repo-score.json ]; then
            cp agent/baselines/main.repo-score.json target/jankurai/accepted-baseline.json
          else
            echo "missing accepted baseline agent/baselines/main.repo-score.json" >&2
            exit 1
          fi
      - name: Install jankurai
        id: install-jankurai
        run: |
          mkdir -p target/jankurai
          if cargo install --git https://github.com/jeppsontaylor/Jankurai.git \
              --tag v1.5.1 --package jankurai --locked 2>target/jankurai/jankurai-install.log \
              || cargo install jankurai --locked 2>>target/jankurai/jankurai-install.log; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            printf 'soft-gate=jankurai-install status=soft-failed ledger=agent/ci-soft-gate-ledger.toml\n' \
              | tee -a target/jankurai/jankurai-install.log
            echo "::warning::jankurai install failed; tool-adoption CI evidence steps will be skipped"
          fi
      - run: jankurai --version
        if: steps.install-jankurai.outputs.installed == 'true'
      - name: Proofbind verify
        if: steps.install-jankurai.outputs.installed == 'true'
        run: jankurai proofbind verify . --changed-from origin/main
      - name: Proofmark rust
        if: steps.install-jankurai.outputs.installed == 'true'
        run: jankurai proofmark rust . --obligations target/jankurai/proofbind/obligations.json
      - name: Rust witness build
        if: steps.install-jankurai.outputs.installed == 'true'
        run: jankurai rust witness build .
      - name: Security lane
        if: steps.install-jankurai.outputs.installed == 'true'
        run: jankurai security run . --strict --profile ci --out target/jankurai/security/evidence.json
      - name: Copy-code audit
        if: steps.install-jankurai.outputs.installed == 'true'
        run: cargo run -p jankurai -- copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md
      - name: Language bad-behavior tests
        if: steps.install-jankurai.outputs.installed == 'true'
        run: |
          rm -rf target/jankurai-src
          if git clone --depth 1 https://github.com/jeppsontaylor/Jankurai.git target/jankurai-src 2>/dev/null; then
            ( cd target/jankurai-src && cargo test -p jankurai --test language_bad_behavior --no-fail-fast ) \
              > >(tee target/jankurai/language-bad-behavior.log) 2>&1
          else
            printf 'attempted: cargo test -p jankurai --test language_bad_behavior\nstatus: upstream-clone-failed\nsoft-gate=jankurai-language-bad-behavior ledger=agent/ci-soft-gate-ledger.toml\n' \
              | tee target/jankurai/language-bad-behavior.log
          fi
      - name: jankurai staged-gate (PR changed files)
        # Mirrors tools/jankurai-hooks/pre-commit but compares against the
        # PR merge base. Blocks the lane on any new hard finding so PRs
        # cannot land changes that JANKURAI_SKIP_HOOKS=1 let through
        # locally.
        if: steps.install-jankurai.outputs.installed == 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: origin/main
        run: bash ops/ci/jankurai-staged-gate.sh
      - name: jankurai audit
        if: steps.install-jankurai.outputs.installed == 'true'
        run: jankurai audit . --mode advisory --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md --sarif target/jankurai/jankurai.sarif --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl
      - name: Upload jankurai SARIF (if produced)
        if: always() && hashFiles('target/jankurai/jankurai.sarif') != ''
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b
        with:
          sarif_file: target/jankurai/jankurai.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          path: |
            agent/repo-score.json
            agent/repo-score.md
            agent/cost-budget.toml
            agent/baselines/main.repo-score.json
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/jankurai.sarif
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/rust/witness-graph.json
            target/jankurai/copy-code.json
            target/jankurai/copy-code.md
            target/jankurai/security/evidence.json
            target/jankurai/migration-report.json
            target/jankurai/language-bad-behavior.log
            target/jankurai/jankurai-install.log

  security:
    # Hard gate end-to-end. Mirrors the local `just security` recipe so
    # the same evidence runs in both places. Audit reference:
    # HLT-016 supply-chain-drift, HLT-034 ci-bad-behavior.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Install actionlint (workflow linter)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
      - name: Install syft (SBOM generator)
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin syft
      # Thin dispatcher: all supply-chain logic lives in ops/ci/security.sh
      # so CI and local (`scripts/ci-local.sh security`, `just security`)
      # run identical commands. Cargo-deny is soft-gated INSIDE the script
      # (see agent/ci-soft-gate-ledger.toml#cargo-deny-check); cargo-audit
      # and gitleaks remain hard gates. actionlint and syft are soft-gated
      # (see ledger entries actionlint-workflow-lint, syft-sbom).
      - name: security lane (ops/ci/security.sh)
        run: bash ops/ci/security.sh

  dependency-review:
    # SBOM-like dependency review on PRs. Compares base vs head
    # manifests for newly-introduced vulnerable or non-allowlisted
    # licenses. PR-only; non-PR runs short-circuit cleanly.
    #
    # Hard gate end-to-end. The dependency-review action itself stays in
    # the workflow YAML (it can only execute inside Actions), but its
    # exit is intercepted by ops/ci/dependency-review.sh which decides
    # whether to fail the lane. The workflow step always runs the
    # script, and the soft-gate semantics live there (see
    # agent/ci-soft-gate-ledger.toml#dependency-review-action).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: dependency-review lane (ops/ci/dependency-review.sh)
        run: bash ops/ci/dependency-review.sh
