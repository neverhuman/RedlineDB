name: jankurai

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Hard gate end-to-end. All soft-gate semantics for jankurai install
    # / language-bad-behavior tests live inside ops/ci/jankurai-audit.sh
    # (see agent/ci-soft-gate-ledger.toml#jankurai-audit-job). No
    # nonblocking overrides appear anywhere in this workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      # Thin dispatcher: every step that used to live inline ("Install
      # jankurai" through "Language bad-behavior tests") is now in
      # ops/ci/jankurai-audit.sh so the same audit lane runs locally via
      # `scripts/ci-local.sh audit`. Audit references:
      # HLT-042 ci-local-parity.lib-missing,
      # HLT-034 ci-bad-behavior.
      - name: jankurai audit lane (ops/ci/jankurai-audit.sh)
        run: bash ops/ci/jankurai-audit.sh
      - name: Upload jankurai SARIF (if produced)
        if: always() && hashFiles('target/jankurai/jankurai.sarif') != ''
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b
        with:
          sarif_file: target/jankurai/jankurai.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          path: |
            agent/repo-score.json
            agent/repo-score.md
            agent/cost-budget.toml
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/jankurai.sarif
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/rust/witness-graph.json
            target/jankurai/ux-qa.json
            target/jankurai/security/evidence.json
            target/jankurai/migration-report.json
            target/jankurai/language-bad-behavior.log
            target/jankurai/jankurai-install.log

  security:
    # Hard gate end-to-end. Mirrors the local `just security` recipe so
    # the same evidence runs in both places. Audit reference:
    # HLT-016 supply-chain-drift, HLT-034 ci-bad-behavior.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Install actionlint (workflow linter)
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
      - name: Install syft (SBOM generator)
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.10.0/syft_1.10.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin syft
      # Thin dispatcher: all supply-chain logic lives in ops/ci/security.sh
      # so CI and local (`scripts/ci-local.sh security`, `just security`)
      # run identical commands. Cargo-deny is soft-gated INSIDE the script
      # (see agent/ci-soft-gate-ledger.toml#cargo-deny-check); cargo-audit
      # and gitleaks remain hard gates. actionlint and syft are soft-gated
      # (see ledger entries actionlint-workflow-lint, syft-sbom).
      - name: security lane (ops/ci/security.sh)
        run: bash ops/ci/security.sh
  dependency-review:
    # SBOM-like dependency review on PRs. Compares base vs head
    # manifests for newly-introduced vulnerable or non-allowlisted
    # licenses. PR-only; non-PR runs short-circuit cleanly.
    #
    # Hard gate end-to-end. The dependency-review action itself stays in
    # the workflow YAML (it can only execute inside Actions), but its
    # exit is intercepted by ops/ci/dependency-review.sh which decides
    # whether to fail the lane. The workflow step always runs the
    # script, and the soft-gate semantics live there (see
    # agent/ci-soft-gate-ledger.toml#dependency-review-action).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.0
      - name: dependency-review lane (ops/ci/dependency-review.sh)
        run: bash ops/ci/dependency-review.sh
