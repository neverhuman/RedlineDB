name: jankurai

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jankurai-audit:
    name: jankurai audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Install jankurai 1.6.10
        run: |
          ver=1.6.10
          mkdir -p ~/.cargo/bin
          curl -fsSL "https://github.com/neverhuman/jankurai/releases/download/v${ver}/jankurai-${ver}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C ~/.cargo/bin jankurai
          ~/.cargo/bin/jankurai --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Jankurai audit
        run: bash ops/ci/jankurai.sh

      - name: Copy-code evidence (copy-code tool)
        run: jankurai copy-code .

      - name: Merge witness (rust-witness tool)
        run: jankurai witness .

      - name: Proof binding map (proofbind tool)
        run: jankurai proofbind map .

      - name: Proof marks rust (proofmark-rust tool)
        run: jankurai proofmark rust .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: redlinedb-jankurai-score
          path: target/jankurai
          if-no-files-found: warn
          retention-days: 30
