name: release

# Build the RedlineDB binary from a pinned redline-core ref and publish it to this
# hub's GitHub Releases. Trigger by pushing a tag (vX.Y.Z) or manually with a ref.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "redline-core git ref to build (tag/branch/sha)"
        required: true
        default: "main"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # releases must not cancel mid-build

permissions:
  contents: write
  id-token: write  # required for SBOM attestation via sigstore

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04, rust_target: x86_64-unknown-linux-gnu }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-gnu }
    steps:
      - name: Checkout RedlineDB hub (release scripts)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "core_ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "core_ref=${{ github.event.inputs.core_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout redline-core (the engine) into engine/
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          repository: neverhuman/redline-core
          ref: ${{ steps.refs.outputs.core_ref }}
          persist-credentials: false
          path: engine

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          workspaces: engine

      - name: Generate SBOM (syft/CycloneDX)
        run: |
          ver=0.117.0
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${ver}/syft_${ver}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin syft
          syft engine/ -o cyclonedx-json=sbom-${{ matrix.target }}.cyclonedx.json

      - name: Build, package, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.refs.outputs.tag }}
          TARGET: ${{ matrix.target }}
          CORE_REF: ${{ steps.refs.outputs.core_ref }}
        run: bash ops/ci/release.sh
