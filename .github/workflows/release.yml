name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Verify release tag
        run: |
          test "${GITHUB_REF_TYPE:-}" = "tag"
          test -n "${GITHUB_REF_NAME:-}"
          git describe --tags --exact-match >/dev/null
      - name: Test
        run: bash ops/ci/pr-ci.sh
      - name: Build package
        run: bash ops/ci/release.sh
      - name: Attest package
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: |
            dist/redline-testing-*-linux-x86_64.tar.gz
            dist/redline-testing-*-linux-x86_64.tar.gz.sha256
            dist/release-manifest.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          # --verify-tag binds the release to a tag that already exists in
          # the repo, preventing accidental release creation against a
          # mutable / non-tag ref.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "redline-testing ${tag}" \
            --verify-tag \
            dist/redline-testing-*-linux-x86_64.tar.gz \
            dist/redline-testing-*-linux-x86_64.tar.gz.sha256 \
            dist/release-manifest.json
