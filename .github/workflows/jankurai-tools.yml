          name: jankurai-agent-tool-supply-receipt
          if-no-files-found: ignore
          path: |
            .jankurai/agent-tool-supply/receipt.json.txt
            .jankurai/agent-tool-supply/install.log
            .jankurai/tool-adoption.toml

  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
