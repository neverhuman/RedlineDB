  input-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: { toolchain: 1.95.0 }
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - name: input-boundary (ops/ci/jankurai-tools.sh)
        run: bash ops/ci/jankurai-tools.sh input-boundary
      - name: Cross-check ffi exec input-boundary tests (HLT-023 negative proofs)
        run: cargo test -p redlinedb-ffi --test exec_input_boundary --locked --no-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-input-boundary-receipt
          if-no-files-found: ignore
          path: |
            .jankurai/input-boundary/receipt.json.txt
            .jankurai/input-boundary/install.log

  agent-tool-supply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: { toolchain: 1.95.0 }
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: agent-tool-supply (ops/ci/jankurai-tools.sh)
        run: bash ops/ci/jankurai-tools.sh agent-tool-supply
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
