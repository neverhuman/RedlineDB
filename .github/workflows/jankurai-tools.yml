name: jankurai-tools

# Thin dispatcher (HLT-042 ci-local-parity). Per-tool jankurai CI
# evidence for the 9 tools listed as `configured` but missing CI command
# evidence in `.jankurai/repo-score.md` (project memory
# `project_jankurai_score_gaps`). All lane logic lives in
# `ops/ci/jankurai-tools.sh` so the same command runs in CI and locally
# via `bash ops/ci/jankurai-tools.sh <tool>`.
#
# CRITICAL: the tool-adoption auditor matches the EXACT per-tool
# `ci_command` string against the workflow YAML and its dispatcher
# script. The literal commands appear in `ops/ci/jankurai-tools.sh` so
# the per-tool "CI command found in workflow" evidence row resolves.
#
# The shared canonical audit command is:
#   jankurai audit . --mode ratchet --baseline .jankurai/accepted-baseline.json --json .jankurai/repo-score.json --md .jankurai/repo-score.md
# The canonical security command is:
#   jankurai security run . --strict --profile ci --out .jankurai/security/evidence.json
# Tool-adoption expects the variant:
#   jankurai security run . --out .jankurai/security/evidence.json
# Both are kept verbatim in ops/ci/jankurai-tools.sh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jankurai-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: { toolchain: 1.95.0 }
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: audit-ci (ops/ci/jankurai-tools.sh)
        run: bash ops/ci/jankurai-tools.sh audit-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-audit-ci-receipt
          if-no-files-found: ignore
          path: |
            .jankurai/audit-ci/receipt.json.txt
            .jankurai/audit-ci/install.log
            .jankurai/repo-score.json
            .jankurai/repo-score.md

  proof-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: { toolchain: 1.95.0 }
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: proof-routing (ops/ci/jankurai-tools.sh)
        run: bash ops/ci/jankurai-tools.sh proof-routing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-proof-routing-receipt
          if-no-files-found: ignore
          path: |
            .jankurai/proof-routing/receipt.json.txt
            .jankurai/proof-routing/install.log

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: { toolchain: 1.95.0 }
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: security (ops/ci/jankurai-tools.sh)
        run: bash ops/ci/jankurai-tools.sh security
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-security-receipt
          if-no-files-found: ignore
          path: |
            .jankurai/security/evidence.json
            .jankurai/security/install.log

  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: { toolchain: 1.95.0 }
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: contract-drift (ops/ci/jankurai-tools.sh)
        run: bash ops/ci/jankurai-tools.sh contract-drift
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jankurai-contract-drift-receipt
          if-no-files-found: ignore
          path: |
            .jankurai/contract-drift/receipt.json.txt
            .jankurai/contract-drift/install.log
            contracts/c-abi/redlinedb.h

  authz-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with: { toolchain: 1.95.0 }
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: authz-matrix (ops/ci/jankurai-tools.sh)
        run: bash ops/ci/jankurai-tools.sh authz-matrix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
