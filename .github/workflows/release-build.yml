name: release-build

# Thin dispatcher (HLT-042 ci-local-parity). Release packaging and upload
# policy live in `ops/ci/release-*.sh` so maintainers can reproduce the same
# commands locally before pushing a release workflow change.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload assets for, for example v1.0.17'
        required: true
        type: string

# Build native binaries for every supported platform and attach them to the
# GitHub release as downloadable tarballs. Tag pushes and manual dispatches
# can also backfill assets for an existing release.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            lib_name: libredlinedb.so
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            lib_name: libredlinedb.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            lib_name: libredlinedb.dylib
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          path: source
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: ${{ matrix.target }}
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: bash ops/ci/release-setup.sh
      - name: Build and Package
        env:
          SOURCE_DIR: source
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
          LIB_NAME: ${{ matrix.lib_name }}
          TARGET: ${{ matrix.target }}
        run: bash ops/ci/release-build.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DIR: source
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: bash ops/ci/release-upload.sh
