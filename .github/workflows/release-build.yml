name: release-build
on:
  push:
    tags: ['v4.1.0*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml
    with: {tag: '${{ github.ref_name }}'}
    permissions:
      contents: read
      attestations: read
  publish:
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - name: Verify stable release ancestry
        env: {TAG: '${{ github.ref_name }}'}
        run: |
          if [[ "$TAG" != *-rc.* ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'packages-*', path: target/packages, merge-multiple: true}
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with: {subject-path: 'target/packages/*.tar.gz'}
      - name: Publish verified archives without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash ops/ci/publish-github-release.sh
