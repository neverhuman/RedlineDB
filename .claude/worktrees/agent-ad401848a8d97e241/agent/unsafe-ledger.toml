# Keep unsafe blocks rare and auditable.
# Each entry should record file, line, owner, invariant, and proof lane.
entries = []

[[entries]]
file = "crates/redlinedb/src/registry.rs"
line = 88
owner = "rust-public-api"
invariant = "REGISTRY is OnceLock<Mutex<Registry>>; not raw global mutation. All registry mutation is serialised by the Mutex guard returned from `registry().lock()`. No raw global aliasing is possible."
proof_lane = "just fast"
test = "crates/redlinedb/src/registry.rs::tests::registry_concurrent_open_returns_shared_handles"

[[entries]]
file = "crates/redlinedb/src/registry.rs"
line = 280
owner = "rust-public-api"
invariant = "libc::flock called with a valid open fd borrowed from `&File` for the call's duration; LOCK_NB ensures non-blocking advisory lock. The descriptor cannot be closed concurrently because we hold a `&File`."
proof_lane = "just fast"
test = "crates/redlinedb/tests/* (integration: process_owner_lock paths)"

[[entries]]
file = "crates/sql/src/statement.rs"
line = 307
owner = "sql-parser-planner-executor"
invariant = "`*mut Txn` is borrowed from `Connection::txn` and lives at least as long as the enclosing `Statement` (finalize_runtime is called on Drop). Exclusive access is enforced by the `with_current_connection` re-entrancy guard so no other code can hold `&mut Txn` concurrently."
proof_lane = "just fast"
test = "crates/sql/tests/* (integration: select runtime exercises borrowed transactions)"

[[entries]]
file = "crates/sql/src/statement.rs"
line = 454
owner = "sql-parser-planner-executor"
invariant = "`conn_ptr` is derived from an `Arc<Connection>` field on `self`, so the allocation is kept alive for the duration of the dereferenced `&Connection`. `Connection` exposes only `&self` methods so no aliasing UB is possible."
proof_lane = "just fast"
test = "crates/sql/tests/* (integration: every statement.step call exercises this)"
