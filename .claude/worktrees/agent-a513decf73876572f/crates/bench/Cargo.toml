[package]
name = "redlinedb-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-utils = "0.8"
hdrhistogram = "7"
libc = "0.2"
# Lane BH P0 #1: parallel certify scheduler bin-packs jobs by their
# thread count against `num_cpus::get()`; reserve a few cores for
# the OS/parent and saturate the rest like `make -jN`.
num_cpus = "1"
rand = "0.9"
rand_chacha = "0.9"
redlinedb = { path = "../redlinedb" }
# Lane E: bench needs to arm kernel failpoints from inside the
# `failpoint-matrix` child process. Cargo feature unification ensures the
# `failpoints` feature also turns on for the kernel inside `redlinedb`.
redlinedb-kernel = { path = "../kernel", features = ["failpoints"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
# Lane BH P1 #7: recursive walk of `.redline` directories so the
# `data_bytes` telemetry sums catalog snapshots, page files,
# control files, and the wal segment fan-out (not just one file).
walkdir = "2"

[dev-dependencies]
# Lane F6: integration tests in `tests/failpoint_matrix.rs` drive
# the `fail` crate directly to assert that a `return` action takes
# the early-return path (and not the panic path the previous bench
# action-mapping silently routed it through).
fail = { version = "0.5", features = ["failpoints"] }
