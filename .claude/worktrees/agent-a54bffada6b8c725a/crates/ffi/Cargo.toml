[package]
name = "redlinedb-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "redlinedb"
# `rlib` is required so integration tests under `tests/` can link against
# the FFI surface (the safety_invariants suite calls `rldb_*` functions
# directly via Rust paths). `cdylib` + `staticlib` keep the C ABI surface.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
redlinedb-kernel = { path = "../kernel" }
redlinedb-sql = { path = "../sql" }
