[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
