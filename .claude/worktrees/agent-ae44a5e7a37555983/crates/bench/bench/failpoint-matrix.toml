# Lane E failpoint-matrix scenarios.
#
# Each `[[cases]]` block names one kernel failpoint, the action the
# `fail` crate should inject when it fires, and the durability + hit
# count parameters to multiply across. The bench harness spawns a
# child per (durability, kill_after_n_hits) tuple, arms the named
# failpoint, runs the INSERT-then-fsync-ack workload, and on child
# death verifies that every fsynced ack row is recoverable.
#
# `action` is passed VERBATIM to `fail::cfg`. The accepted grammar is
# the `fail` crate's: `panic`, `return(value)`, `off`, `print(msg)`,
# `pause`, `sleep(N)`, `yield`, plus `K*action` (count) and `K%action`
# (probability) prefixes. The bench runner only prepends the count
# from `kill_after_n_hits`; it does not rewrite the action keyword.
# In particular `return` is honoured as the early-return short-circuit
# and is NOT silently translated to `panic`. The kernel's `wal::flush`
# hook accepts the `return` action by exposing a closure form that
# maps the early return to "successful no-op flush" (i.e. fsync was
# skipped) — that is exactly the wal-fsync-skipped scenario.
#
# Lane FP NOTE: revisions before phase:9/lane-fp used `action = "abort"`
# for the kill-style cases. The `fail` crate does not recognise `abort`
# — it returns Err — and the bench runner false-passed every case
# because acked and recovered both ended at zero. The kill-style
# entries are now `action = "panic"`, the original intent (panic on a
# background or foreground thread, the child's panic hook then aborts
# the process so the parent sees a non-zero exit). The kernel `cfg`
# wrapper now validates against the fail grammar so `abort` would be
# rejected loudly at the configuration boundary.
#
# The child's ack log is `sync_all()`'d after every entry (and after
# initial creation, including a parent-directory fsync) so the
# `read_ack_count` oracle is durable across a crash. Without that, the
# gate could record zero lost-acked-commits even when acked rows were
# silently lost — a false negative. See `failpoint_matrix::run_child`.
#
# `kill_after_n_hits` controls the `K*action` prefix passed to
# `fail::cfg`; values > 1 let the workload survive the first K-1
# fires and crash on the K-th, exposing late-stage divergence.
#
# Default `durabilities` covers the only contract Lane E gates on
# (`strict`); cases that explicitly list `durabilities = ["strict",
# "normal"]` extend coverage for non-fsync-skipping variants.

[[cases]]
name = "wal-write-torn"
failpoint = "wal::write_encoded"
action = "panic"
durabilities = ["strict", "normal"]
rows = 1024
kill_after_n_hits = [1, 5, 25]
expect_child_exit = "non-zero"
# kill_after_n_hits=1 panics on the FIRST WAL write, which happens
# inside the workload's first INSERT commit before that commit
# returns Ok — so acked=0 even though the commit may have durably
# logged. The kill_after=5/25 variants survive several inserts
# (acked > 0) and exercise the gate non-vacuously.
expect_zero_acks = true

[[cases]]
name = "wal-fsync-skipped"
failpoint = "wal::flush"
action = "return"
durabilities = ["strict"]
rows = 1024
kill_after_n_hits = [1, 5, 25]
# `return` short-circuits wal::flush so the workload completes; the
# child exits cleanly. Strict durability still requires every acked
# row to recover even when fsync was skipped, because WAL writes
# durably committed on the previous fsync still bound the watermark.
expect_child_exit = "zero"

[[cases]]
name = "commit-publish-kill"
failpoint = "engine::commit::before_publish"
action = "panic"
durabilities = ["strict", "normal"]
rows = 1024
kill_after_n_hits = [1, 5, 25]
expect_child_exit = "non-zero"
# Same as wal-write-torn: kill_after=1 panics inside the workload's
# very first commit before it acks. The kill_after=5/25 cases see
# acks > 0 and exercise the gate fully.
expect_zero_acks = true

[[cases]]
name = "heap-mutation-kill"
failpoint = "heap::mutation"
action = "panic"
durabilities = ["strict"]
rows = 1024
kill_after_n_hits = [1, 5, 25]
expect_child_exit = "non-zero"
expect_zero_acks = true

[[cases]]
name = "index-insert-kill"
failpoint = "index::insert"
action = "panic"
durabilities = ["strict"]
rows = 1024
kill_after_n_hits = [1, 5, 25]
expect_child_exit = "non-zero"
expect_zero_acks = true

[[cases]]
name = "catalog-rename-kill"
failpoint = "catalog::save::rename"
action = "panic"
durabilities = ["strict"]
rows = 64
kill_after_n_hits = [1]
# Catalog rename fires during initial schema setup, before any commit
# acks. The child dies; `acked == 0` is expected here.
expect_child_exit = "non-zero"
expect_zero_acks = true

[[cases]]
name = "checkpoint-kill"
failpoint = "engine::checkpoint"
action = "panic"
durabilities = ["strict"]
rows = 1024
kill_after_n_hits = [1, 3]
expect_child_exit = "non-zero"
