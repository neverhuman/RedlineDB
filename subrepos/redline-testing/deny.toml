# cargo-deny policy for redline-testing.
#
# Run locally and in CI via `bash ops/ci/security.sh` (which calls
# `cargo deny check`). Keeps the dependency graph free of disallowed
# licenses, known-vulnerable crates, and untrusted sources.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add specific RUSTSEC ids here only with a dated justification.
ignore = []

[licenses]
# SPDX identifiers for every license that may appear in the dependency graph.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
