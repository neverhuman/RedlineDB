[package]
name = "xtask"
version = "1.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.95"
description = "Internal dev tools for redline-testing corpus, CI, and release support."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
