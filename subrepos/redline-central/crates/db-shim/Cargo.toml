[package]
name = "db-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backend-neutral database contract with isolated Redline, SQLite, and Postgres adapters."

[features]
default = ["backend-redline"]
backend-redline = ["dep:redlinedb-client"]
oracle-postgres = ["dep:postgres"]
oracle-sqlite = ["dep:rusqlite"]

[dependencies]
postgres = { version = "0.19.13", optional = true }
redlinedb-client = { path = "../redlinedb-client", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "db-shim-parity"
path = "src/bin/parity.rs"
