# Beyond-SQLite skip-list (Postgres-only feature gating)
#
# Entries here mark beyond-SQLite cases that the corpus deliberately does NOT
# attempt to close against redlinedb, because the underlying Postgres feature
# has no SQLite-shape analog. See `docs/beyond-postgres-skips.md` for the
# triage policy and per-category rationale.
#
# Schema: each entry is a [[skip]] table with
#   case_id        — the BEYOND-CASE-<n> identifier from
#                    corpus/beyond_sqlite/generated_manifest.json
#   name           — the EXACT case name from the manifest
#   category       — the BEYOND_* taxonomy bucket
#   rationale      — one paragraph explaining why no SQLite-shape mapping
#                    exists and what would be required to implement
#   target_release — "deferred" (no plan to revisit) or a specific version
#
# Generated by the gap-closure triage pass against
#   /home/ubuntu/redlineDB/target/redline-testing/beyond_pg_baseline.jsonl
# (233 failures triaged; 114 skipped here, 119 returned as closable in
# `target/redline-testing/closable-beyond-pg.txt`).

# =============================================================================
# BEYOND_LISTEN_NOTIFY (14)
# Postgres LISTEN/NOTIFY is a session-bound async pub/sub IPC primitive.
# Implementing requires a multi-session event queue, per-session subscription
# tracking, and a NOTIFY catalog surface that does not fit sqlite_master.
# =============================================================================

[[skip]]
case_id        = "20430"
name           = "LISTEN_BASIC"
category       = "BEYOND_LISTEN_NOTIFY"
rationale      = "LISTEN/NOTIFY is a session-bound async IPC primitive with no SQLite-shape analog. Implementing would require a new connection-scoped event queue, multi-session signaling, and a NOTIFY catalog surface that does not map onto sqlite_master."
target_release = "deferred"

