target_release = "deferred"

# =============================================================================
# BEYOND_RICH_TYPES (6)
# ENUM and DOMAIN as first-class types (pg_type catalog entries), range
# types (int4range / && / @>), MONEY (locale-sensitive currency rendering),
# and the geometric type family (point / <-> / GiST-indexable). All require
# new top-level types that do not fit the SQLite TEXT/INTEGER/REAL/BLOB/NULL
# storage classes.
# =============================================================================

[[skip]]
case_id        = "20020"
name           = "ENUM_CREATE_AND_USE"
category       = "BEYOND_RICH_TYPES"
rationale      = "CREATE TYPE ... AS ENUM defines a first-class enum type with ordered membership and pg_type catalog presence. SQLite has no CREATE TYPE DDL; the closest analog is CHECK (col IN (...)) which lacks the ordering and the type identity. Implementing ENUM as a real type would require a new pg_type-style catalog surface."
target_release = "deferred"

[[skip]]
case_id        = "20022"
name           = "DOMAIN_TYPE_BASIC"
category       = "BEYOND_RICH_TYPES"
rationale      = "CREATE DOMAIN defines a reusable constrained type with its own pg_type entry. SQLite has no DOMAIN concept; the closest analog is repeating CHECK constraints on each column. First-class domains would require a new pg_type-style catalog surface."
target_release = "deferred"

[[skip]]
case_id        = "20026"
name           = "RANGE_INT4RANGE_CONTAINS"
category       = "BEYOND_RICH_TYPES"
rationale      = "int4range and the wider range-type family (anyrange) are first-class Postgres-specific types with their own constructors, containment/overlap operators (@>, &&, ||), and indexing support. SQLite has no range type; a 2-column lower-fidelity port would not preserve operator overloading."
target_release = "deferred"

[[skip]]
case_id        = "20027"
name           = "RANGE_OVERLAP"
category       = "BEYOND_RICH_TYPES"
rationale      = "Range && (overlap) operator requires the range-type infrastructure; same scope cut as int4range."
target_release = "deferred"

[[skip]]
case_id        = "20028"
name           = "MONEY_RENDER"
category       = "BEYOND_RICH_TYPES"
rationale      = "MONEY is a Postgres locale-sensitive currency-display type that emits values like '$123.45' under en_US. SQLite has no analog and locale-sensitive currency rendering is out of scope; representing as text would defeat the typed-arithmetic semantics."
target_release = "deferred"

[[skip]]
case_id        = "20030"
name           = "POINT_GEOMETRY"
category       = "BEYOND_RICH_TYPES"
rationale      = "Geometric type point + distance operator <-> requires the full geometric type family (point/line/lseg/box/circle/path/polygon) plus PG-specific spatial operators. SQLite has no geometric types; a PostGIS-equivalent would be a separate extension surface."
target_release = "deferred"

# =============================================================================
# BEYOND_MIGRATION_ERGONOMICS (6)
# ALTER TABLE knobs that operate on Postgres-specific physical layout
# concepts: INHERIT/NO INHERIT (table inheritance), SET UNLOGGED/LOGGED
# (per-table WAL participation), SET STATISTICS (per-column ANALYZE target),
# SET STORAGE (per-column TOAST strategy), SET (autovacuum_enabled), OWNER
# TO + SET WITHOUT CLUSTER (Postgres role/owner model + CLUSTER heap rewrite).
# =============================================================================

[[skip]]
case_id        = "20213"
name           = "ALTER_TABLE_INHERIT_NO_INHERIT"
category       = "BEYOND_MIGRATION_ERGONOMICS"
rationale      = "ALTER TABLE INHERIT / NO INHERIT is the Postgres table-inheritance feature. SQLite has no INHERIT concept and there is no clean lower-fidelity port; parent reads must transparently include child rows."
target_release = "deferred"

[[skip]]
case_id        = "20214"
name           = "ALTER_TABLE_SET_LOGGED_UNLOGGED"
category       = "BEYOND_MIGRATION_ERGONOMICS"
rationale      = "ALTER TABLE SET UNLOGGED / SET LOGGED toggles WAL participation per table (relpersistence 'u' vs 'p'). SQLite has no per-table WAL participation toggle."
target_release = "deferred"

[[skip]]
case_id        = "20215"
name           = "ALTER_COLUMN_SET_STATISTICS"
category       = "BEYOND_MIGRATION_ERGONOMICS"
rationale      = "ALTER COLUMN SET STATISTICS sets the per-column ANALYZE target. Redlinedb has no equivalent planner-statistics tuning surface to twiddle."
target_release = "deferred"

[[skip]]
case_id        = "20216"
name           = "ALTER_COLUMN_SET_STORAGE"
category       = "BEYOND_MIGRATION_ERGONOMICS"
rationale      = "ALTER COLUMN SET STORAGE controls Postgres's per-column TOAST storage strategy. Redlinedb does not use TOAST-style out-of-line storage with the same per-column knob."
target_release = "deferred"

[[skip]]
case_id        = "20217"
name           = "ALTER_TABLE_SET_AUTOVACUUM_OPTION"
category       = "BEYOND_MIGRATION_ERGONOMICS"
rationale      = "ALTER TABLE SET (autovacuum_enabled = true) sets a Postgres-specific reloption. SQLite has no autovacuum tuning per-table."
target_release = "deferred"

[[skip]]
case_id        = "20219"
name           = "ALTER_TABLE_OWNER_AND_WITHOUT_CLUSTER"
category       = "BEYOND_MIGRATION_ERGONOMICS"
rationale      = "ALTER TABLE OWNER TO + SET WITHOUT CLUSTER requires the Postgres role/owner model AND the CLUSTER concept (rewriting heap in index order). Neither has a SQLite analog."
target_release = "deferred"

# =============================================================================
# BEYOND_SCHEMAS_SEQUENCES (4)
# Per-session search_path stack and CREATE SCHEMA AUTHORIZATION require a
# session-settings surface and a role/owner model that SQLite (which uses
# ATTACH DATABASE instead of search_path, and has no roles) does not provide.
# Most other schema/sequence cases ARE closable; only these four are deep.
# =============================================================================

[[skip]]
case_id        = "20243"
name           = "SEARCH_PATH_RESOLVES_UNQUALIFIED"
category       = "BEYOND_SCHEMAS_SEQUENCES"
rationale      = "SET search_path TO ... is a session-scoped Postgres-specific name-resolution stack. SQLite has ATTACH DATABASE for cross-namespace access but no per-session search_path; implementing would require a new session-settings surface plus a dynamic resolver."
target_release = "deferred"

[[skip]]
case_id        = "20254"
name           = "CREATE_SCHEMA_AUTHORIZATION_CURRENT_USER"
category       = "BEYOND_SCHEMAS_SEQUENCES"
rationale      = "CREATE SCHEMA AUTHORIZATION CURRENT_USER requires the Postgres role/owner model; redlinedb has no per-object owner field and no role catalog."
target_release = "deferred"

[[skip]]
case_id        = "20256"
name           = "SET_SEARCH_PATH_EMPTY"
category       = "BEYOND_SCHEMAS_SEQUENCES"
rationale      = "SET search_path TO '' (empty) uses the same per-session search_path surface as SEARCH_PATH_RESOLVES_UNQUALIFIED; deferred together."
target_release = "deferred"

[[skip]]
case_id        = "20257"
name           = "CURRENT_SCHEMA_FUNCTION"
category       = "BEYOND_SCHEMAS_SEQUENCES"
rationale      = "current_schema() depends on the per-session search_path surface."
target_release = "deferred"

