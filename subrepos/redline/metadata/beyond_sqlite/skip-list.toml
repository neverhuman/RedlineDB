# =============================================================================
# BEYOND_MVCC_LOCKING (9)
# Row-level lock matrix (FOR KEY SHARE / NO KEY UPDATE), pg_locks / advisory
# locks, LOCK TABLE explicit relation locks, txid/backend-pid introspection.
# All require Postgres's heavyweight lock manager and per-backend identity
# surface, none of which fit SQLite's implicit lock progression model.
# =============================================================================

[[skip]]
case_id        = "20404"
name           = "SELECT_FOR_KEY_SHARE"
category       = "BEYOND_MVCC_LOCKING"
rationale      = "SELECT FOR KEY SHARE is the weakest of Postgres's four row-level lock modes (KEY SHARE / SHARE / NO KEY UPDATE / UPDATE). SQLite has no row-level lock matrix; adding these would require a row-lock manager that does not fit redlinedb's transaction model. Deferred."
target_release = "deferred"

[[skip]]
case_id        = "20405"
name           = "SELECT_FOR_NO_KEY_UPDATE"
category       = "BEYOND_MVCC_LOCKING"
rationale      = "SELECT FOR NO KEY UPDATE uses the same Postgres row-level lock matrix as FOR KEY SHARE; deliberately deferred together."
target_release = "deferred"

[[skip]]
case_id        = "20406"
name           = "TXID_CURRENT_IN_TX"
category       = "BEYOND_MVCC_LOCKING"
rationale      = "txid_current() exposes a 64-bit Postgres transaction id with wraparound semantics; redlinedb does not surface a comparable xact-id. SQLite has no analog. Deferred."
