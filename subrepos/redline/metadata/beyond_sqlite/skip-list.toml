name           = "COLLATE_CUSTOM_CI_NONDETERMINISTIC"
category       = "BEYOND_COLLATIONS_ILIKE"
rationale      = "CREATE COLLATION with deterministic=false (nondeterministic ICU collation) is a Postgres-specific concept that breaks the SQL standard requirement that equality is reflexive on byte representation. SQLite collations are always deterministic. Implementing would require a new equality-class infrastructure that does not fit SQLite-shape COLLATE NOCASE/BINARY/RTRIM."
target_release = "deferred"

