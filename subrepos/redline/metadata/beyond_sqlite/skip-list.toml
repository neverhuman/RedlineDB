category       = "BEYOND_COLLATIONS_ILIKE"
rationale      = "CREATE EXTENSION citext requires an extension/loader infrastructure plus a registered case-insensitive text type with operator overloads. SQLite's COLLATE NOCASE is the closest analog but it is per-column COLLATE, not a first-class type. Implementing citext as a real type is out of scope."
target_release = "deferred"

