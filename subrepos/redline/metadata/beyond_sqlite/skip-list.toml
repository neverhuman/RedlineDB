# =============================================================================
# BEYOND_STORED_PROCEDURES (19)
# CREATE FUNCTION / CREATE PROCEDURE / CALL / PL/pgSQL require a pg_proc-style
# catalog, a SQL-bodied function executor, AND a full PL/pgSQL interpreter
# (DECLARE blocks, control flow, EXCEPTION blocks, RETURN NEXT/QUERY). SQLite
# has user-defined functions only via the host API, not via SQL DDL, and no
# procedural language at SQL level.
# =============================================================================

[[skip]]
case_id        = "20300"
name           = "FUNC_LANG_SQL_ARG_RETURN"
category       = "BEYOND_STORED_PROCEDURES"
rationale      = "CREATE FUNCTION ... LANGUAGE sql requires a function catalog plus per-call argument binding and a SQL function body executor. SQLite has user-defined functions only via host API, not via SQL DDL. Implementing would require a new pg_proc-style catalog surface and a SQL-bodied function executor. Deliberately deferred."
target_release = "deferred"

