# its own vector indexes (HNSW, DiskANN, IVFFlat) — those are tracked under
# the closable list when expressed in portable shape. Cases skipped here
# require PG-flavored CREATE INDEX USING <am> syntax that points to specific
# Postgres access methods, OR a PG extension surface.
