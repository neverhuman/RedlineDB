name           = "COLLATE_ICU_LANGUAGE_SORT"
category       = "BEYOND_COLLATIONS_ILIKE"
rationale      = "COLLATE \"en-x-icu\" depends on Postgres's ICU-provider collation surface (en-x-icu is the en locale loaded via the ICU provider). SQLite has only BINARY/NOCASE/RTRIM and host-registered collations; ICU-provider collation names are not portable."
