system = "redline-web"
version = 1

[policy]
default = "manual"
generated_content_must_be_reproducible = true
generated_content_requires_marker = true

[[protected_zones]]
path = "docs/**"
rule = "Human-authored documentation by default."

[[protected_zones]]
path = "apps/web/dist/**"
rule = "Built frontend assets; regenerated by `npm run build`."

[[zone]]
allowed = true
kind = "http-contract"
path = "contracts/openapi/redline-web.openapi.json"
command = "bash ops/ci/contract-drift.sh"
source = "CONTRACT.md + apps/api/src/model.rs + apps/web/src/api/types.ts -> contracts/openapi/redline-web.openapi.json"
required_marker = "Contract zone: verified by bash ops/ci/contract-drift.sh. Source: CONTRACT.md + apps/api/src/model.rs + apps/web/src/api/types.ts. DO NOT EDIT WITHOUT UPDATING THE DTOs."
