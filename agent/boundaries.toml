schema_version = "1.0.0"
workspace = "jain-split-ops"
profile = "control-plane"
required_check = "jain-split-ops/required"

[split]
cross_repo_dependency_policy = "pinned-local-jeryu-git-tags"
local_path_patches = false

[release_automation]
entrypoint = "release-candidate.sh"
owner = "tools/splitctl/src/release_candidate.rs"
shell_policy = "thin-exec-only"
production_mode = false
receipt_root = "docs/release-evidence/8.0.0/orchestrator"

cargo_members = [

]

[contracts]
role = "none"
canonical_repo = "jain-core"
mirror_check = "just contract-drift"

[db]
root_paths = ["db/"]
migration_paths = ["db/migrations/"]
constraint_paths = ["db/constraints/"]
owner = "data"
