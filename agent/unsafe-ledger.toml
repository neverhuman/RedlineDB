line = 256
owner = "phase10-diskann-index"
invariant = "`slice::align_to::<f32>` never dereferences; returns the 4-aligned middle window plus the unaligned head/tail bytes; we check both head and tail are empty so any non-4-aligned input is rejected with `SectorError::LayoutMismatch` before any f32 read. f32 has no validity invariant beyond its 4-byte width (NaN bit patterns are valid f32); lifetime `'a` is preserved because the returned slice borrows from `vector_bytes`, which borrows from `buf: &'a [u8]`."
proof_lane = "rtk cargo test -p redlinedb-kernel --lib vector::diskann::sectors --locked"

[[entries]]
