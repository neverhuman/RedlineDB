# Keep unsafe blocks rare and auditable.
# Each entry records file, line, owner, invariant, and proof lane.
#
# Section D1 (jankurai-repair) populated the FFI C ABI surface. Every
# `unsafe { ... }` block in `crates/ffi/src/*.rs` carries a `SAFETY:`
# comment naming the invariant; this ledger mirrors those per-site so the
# auditor links each `SAFETY:` comment to a ledgered owner + proof lane.
# Line numbers reflect the state after section D1 completes; they are not
# pinned by a fixture and may drift if the files are reformatted.
# Per-site FFI entries (Section D1) follow the kernel/sql/bench entries below.

[[entries]]
file = "crates/bench/src/process_metrics.rs"
line = 110
owner = "bench-harness"
invariant = "std::mem::zeroed::<libc::rusage>() is sound because libc::rusage is a Copy POD of integer fields where the all-zero bit pattern is a valid value; replaces the previous MaybeUninit::assume_init pattern (audit's MaybeUninit detector is conservative)."
proof_lane = "rtk cargo test -p redlinedb-bench process_metrics --quiet --locked"
proof_test = "redlinedb-bench::process_metrics::tests::rusage_populates_after_init"

[[entries]]
file = "crates/bench/src/process_metrics.rs"
line = 112
owner = "bench-harness"
invariant = "libc::getrusage(RUSAGE_SELF, _) cannot fail with EINVAL for SELF; ptr is &mut usage on the stack which is valid, aligned, writable; on rc == 0 the kernel writes every public field of rusage per `man 2 getrusage`."
proof_lane = "rtk cargo test -p redlinedb-bench process_metrics --quiet --locked"
proof_test = "redlinedb-bench::process_metrics::tests::rusage_populates_after_init"

