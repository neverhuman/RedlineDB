# Keep unsafe blocks rare and auditable.
# Each entry records file, line, owner, invariant, and proof lane.
# Section D of the jankurai repair plan fills these in per file as
# SAFETY comments land. File-glob entries are placeholders awaiting
# per-line entries from the matching D sub-section.

[[entries]]
file = "crates/ffi/src/*.rs"
owner = "c-abi"
proof_lane = "rtk cargo test -p redlinedb-ffi --quiet --locked"
invariant = "all unsafe blocks dereference raw pointers obtained from the public C ABI; callers are bound by the contract in docs/exceptions/ffi-c-header.md; ledger populated per-site by Section D1"

