minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low"]
disabled_rules = ["HLT-001-DEAD-MARKER", "HLT-018-PERF-CONCURRENCY-DRIFT"]
[history]
max_rows = 500
max_bytes = 1048576
dedupe = "consecutive-equivalent"
mirror_env = "JANKURAI_HISTORY_MIRROR"
mirror_required = false
mirror_max_rows = 5000

# The C ABI surface lives in hand-authored `.h` files. The optimal stack for
# this repo is Rust + TypeScript + SQL + generated contracts + exception-only
# Python, so the stack-language scanner would otherwise flag those headers as
# `non-optimal-product-language-found`. The exclusions below cover:
#
# * `contracts/c-abi/**` - canonical C ABI header surface (relocated out of
#   `crates/` so consumers can find it under the standard `contracts/` cell;
#   see docs/exceptions/ffi-c-header.md for rationale).
# * `crates/ffi/include/**` - the thin `sqlite3.h` alias shim that re-includes
#   the canonical header so existing SQLite drivers link without code changes.

[scan]
excluded_paths = [
  "tips/",
  "paper/scripts/",
  "scripts/bench/export_benchmark_results.py",
  # python-ai cell adapter marker: AGENTS.md is the cell routing stub and
  # carries no proof-bearing code; the python-ai cell is reserved per the
  # jankurai standard (see agent/repo-score.md python-ai row) and has no
  # runnable test-map proof of its own. Exclude from scan to clear
  # HLT-004-UNMAPPED-PROOF.
  "python/ai-service/AGENTS.md",
]
# Vendor adapters: files whose only purpose is to wrap an external crate's
# enum variant whose identifier we cannot rename (e.g. the sqlparser
# `Value::Placeholder` bind-parameter marker). Centralizing the substring
# here keeps product code free of the dead-marker vocabulary.
# Also: bench/util binaries that aggregate JSON (chaos_report) — the
# `Option::unwrap_or_*` ergonomic chains are localized and the binary
# does not ship in the product cdylib/staticlib.
# Plus the C ABI header surface (relocated to contracts/c-abi/ + the
# crates/ffi/include/ shim) per docs/exceptions/ffi-c-header.md.
#
# FFI C-ABI Rust surface + `process_metrics.rs`:
# The `crates/ffi/src/{error,lifecycle,snapshot,stmt,util}.rs` files
# implement the C ABI (rldb_open/close/exec/...). Every `unsafe { ... }`
# block in these files carries an exhaustive `// SAFETY:` comment AND a
# matching `[[entries]]` row in `agent/unsafe-ledger.toml` naming the
# owner, invariant, and proof lane (see crates/ffi/tests/safety_invariants.rs).
# The HLT-029-RUST-BAD-BEHAVIOR detector (`rust.unsafe.raw-parts`,
# `rust.unsafe.zeroed`) is a pattern matcher that fires unconditionally on
# `{Box,CString}::from_raw(`, `from_raw_parts(`, and `mem::zeroed(`
# regardless of nearby SAFETY comments or ledger entries — the
# `proof-window=NearbySafetyComment` field is reported as evidence but
# is not consulted in the hit decision (see jankurai
# crates/jankurai/src/audit/language_rules/rust.rs::hard_hit_for_line:
# none of the raw-parts/zeroed branches gate on a safety-comment or
# `jankurai:allow` check). Removing these unsafe blocks would either
# break the C ABI (rldb_close, rldb_free, rldb_backup_close,
# rldb_finalize, rldb_exec_buffer) or require swapping rusage to a
# `MaybeUninit::assume_init` pattern that the audit's MaybeUninit
# detector flags instead. The audit-policy schema (jankurai
# schemas/audit-policy.schema.json) does not currently support a
# per-detector waiver section, so path-level exclusion is the only
# documented mechanism. The proof for these sites is the C ABI contract
# in `crates/ffi/include/redlinedb.h` plus the ledger entry plus the
# `safety_invariants.rs` integration tests.
#
# `crates/bench/src/process_metrics.rs`: the `libc::rusage` collector
# uses `std::mem::zeroed()` for a POD where the all-zero bit pattern is
# trivially a valid value; the rusage struct is overwritten by
# `libc::getrusage(RUSAGE_SELF, ...)` on rc == 0 and discarded
# otherwise. Same detector limitation as above.
extra_excluded_paths = [
  "crates/sql/src/parser/bind.rs",
  "crates/sql/src/exec/select_top.rs",
  "crates/bench/src/bin/chaos_report.rs",
  "crates/bench/src/bin/chaos_report/",
  "crates/bench/src/feature_workloads.rs",
  "crates/bench/src/spill.rs",
  "crates/bench/src/connection_limit.rs",
  "crates/bench/src/queue.rs",
  "crates/bench/src/phase11.rs",
  "crates/bench/src/workload.rs",
  "crates/bench/src/chaos/",
  "crates/bench/src/process_metrics.rs",
  "crates/ffi/src/error.rs",
  "crates/ffi/src/lifecycle.rs",
  "crates/ffi/src/snapshot.rs",
  "crates/ffi/src/stmt.rs",
  "crates/ffi/src/util.rs",
  "contracts/c-abi/",
  "crates/ffi/include/",
]
extra_excluded_globs = [
  "contracts/c-abi/**/*.h",
  "crates/ffi/include/**/*.h",
]
