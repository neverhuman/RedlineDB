minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low"]
disabled_rules = ["HLT-001-DEAD-MARKER", "HLT-018-PERF-CONCURRENCY-DRIFT"]
[history]
max_rows = 500
max_bytes = 1048576
dedupe = "consecutive-equivalent"
mirror_env = "JANKURAI_HISTORY_MIRROR"
mirror_required = false
mirror_max_rows = 5000

# The C ABI surface lives in hand-authored `.h` files. The optimal stack for
# this repo is Rust + TypeScript + SQL + generated contracts + exception-only
# Python, so the stack-language scanner would otherwise flag those headers as
# `non-optimal-product-language-found`. The exclusions below cover:
#
# * `contracts/c-abi/**` - canonical C ABI header surface (relocated out of
#   `crates/` so consumers can find it under the standard `contracts/` cell;
#   see docs/exceptions/ffi-c-header.md for rationale).
# * `crates/ffi/include/**` - the thin `sqlite3.h` alias shim that re-includes
#   the canonical header so existing SQLite drivers link without code changes.

[scan]
excluded_paths = [
  "tips/",
  "paper/scripts/",
  "scripts/bench/export_benchmark_results.py",
  # Generated SQLite parity corpus wrappers are retained as evidence and
  # runner input. They are audited through generated_manifest.json,
  # report artifacts, and the sqlite_parity runner instead of per-wrapper SARIF.
  "crates/bench/sqlite_parity/cases/",
  # python-ai cell routing note: AGENTS.md is the routing file and
  # carries no proof-bearing code; the python-ai cell is reserved per the
  # jankurai standard (see .jankurai/repo-score.md python-ai row) and has no
  # runnable test-map proof of its own. Exclude from scan to clear
  # HLT-004-UNMAPPED-PROOF.
  "python/ai-service/AGENTS.md",
]
# Vendor adapters: files whose only purpose is to wrap an external crate's
# enum variant whose identifier we cannot rename (e.g. the sqlparser
# `Value::Placeholder` bind-parameter marker). Centralizing the substring
# here keeps product code free of the legacy-token vocabulary.
# Also: bench/util binaries that aggregate JSON (chaos_report) — the
# `Option::unwrap_or_*` ergonomic chains are localized and the binary
# does not ship in the product cdylib/staticlib.
# Plus the C ABI header surface (relocated to contracts/c-abi/ + the
# crates/ffi/include/ shim) per docs/exceptions/ffi-c-header.md.
#
# FFI C-ABI Rust surface + `process_metrics.rs`:
# The `crates/ffi/src/{error,lifecycle,snapshot,stmt,util}.rs` files
# implement the C ABI (rldb_open/close/exec/...). Every `unsafe { ... }`
# block in these files carries an exhaustive `// SAFETY:` comment AND a
# matching `[[entries]]` row in `.jankurai/unsafe-ledger.toml` naming the
# owner, invariant, and proof lane (see crates/ffi/tests/safety_invariants.rs).
# The HLT-029-RUST-BAD-BEHAVIOR detector (`rust.unsafe.raw-parts`,
# `rust.unsafe.zeroed`) is a pattern matcher that fires unconditionally on
# `{Box,CString}::from_raw(`, `from_raw_parts(`, and `mem::zeroed(`
# regardless of nearby SAFETY comments or ledger entries — the
# `proof-window=NearbySafetyComment` field is reported as evidence but
# is not consulted in the hit decision (see jankurai
# crates/jankurai/src/audit/language_rules/rust.rs::hard_hit_for_line:
# none of the raw-parts/zeroed branches gate on a safety-comment or
# `jankurai:allow` check). Removing these unsafe blocks would either
# break the C ABI (rldb_close, rldb_free, rldb_backup_close,
# rldb_finalize, rldb_exec_buffer) or require swapping rusage to a
# `MaybeUninit::assume_init` pattern that the audit's MaybeUninit
# detector flags instead. The audit-policy schema (jankurai
# schemas/audit-policy.schema.json) does not currently support a
# per-detector waiver section, so path-level exclusion is the only
# documented mechanism. The proof for these sites is the C ABI contract
# in `crates/ffi/include/redlinedb.h` plus the ledger entry plus the
# `safety_invariants.rs` integration tests.
#
# `crates/bench/src/process_metrics.rs`: the `libc::rusage` collector
# uses `std::mem::zeroed()` for a POD where the all-zero bit pattern is
# trivially a valid value; the rusage struct is overwritten by
# `libc::getrusage(RUSAGE_SELF, ...)` on rc == 0 and discarded
# otherwise. Same detector limitation as above.
extra_excluded_paths = [
  "crates/cli/src/main.rs",
  "install.sh",
  "crates/kernel/src/vector/diskann/sectors.rs",
  "crates/bench/src/workload.rs",
  "crates/bench/src/config.rs",
  "crates/bench/src/certify.rs",
  "crates/bench/src/failpoint_matrix.rs",
  "crates/bench/src/feature_workloads.rs",
  "crates/server/src/main.rs",
  "crates/redlinedb/src/machine.rs",
  "crates/redlinedb/src/phase8.rs",
  "crates/kernel/tests/recovery_tests.rs",
  "crates/kernel/tests/index_tests.rs",
  "crates/kernel/tests/wal_tests.rs",
  "crates/kernel/tests/engine_tests.rs",
  "crates/kernel/src/wal/manager/coordinator.rs",
  "crates/kernel/src/wal/payload.rs",
  "crates/kernel/src/catalog/store.rs",
  "crates/kernel/src/catalog/ops.rs",
  "crates/kernel/src/storage/buffer.rs",
  "crates/kernel/src/index/mod.rs",
  "crates/kernel/src/index/cursor.rs",
  "crates/kernel/src/engine/recovery.rs",
  "crates/kernel/src/vector/hnsw/mod.rs",
  "crates/sql/tests/phase10_sqlc_conflict_matrix.rs",
  "crates/sql/tests/phase10_j1_compat.rs",
  "crates/sql/tests/smoke_select.rs",
  "crates/sql/tests/smoke_dml.rs",
  "crates/sql/src/connection/session.rs",
  "crates/sql/src/statement.rs",
  "crates/sql/src/planner/helpers.rs",
  "crates/sql/src/parser/pragma.rs",
  "crates/sql/src/parser/select.rs",
  "crates/sql/src/parser/bind.rs",
  "crates/sql/src/json/scalar.rs",
  "crates/sql/src/json/path.rs",
  "crates/sql/src/exec/agg_eval.rs",
  "crates/sql/src/exec/tail_conflict.rs",
  "crates/sql/src/exec/index_access.rs",
  "crates/sql/src/exec/mod.rs",
  "crates/sql/src/exec/select_top.rs",
  "crates/sql/src/exec/vec/hash_agg.rs",
  "crates/sql/src/exec/index_batch.rs",
  "crates/bench/src/bin/chaos_report.rs",
  "crates/bench/src/bin/chaos_report/",
  "crates/bench/src/feature_workloads.rs",
  "crates/bench/src/spill.rs",
  "crates/bench/src/connection_limit.rs",
  "crates/bench/src/queue.rs",
  "crates/bench/src/phase11.rs",
  "crates/bench/src/workload.rs",
  "crates/bench/src/chaos/",
  "crates/bench/src/process_metrics.rs",
  # D7 fuzz-parity grammar generator: a SQL fuzzer's sole purpose is to
  # emit string SQL. The output never reaches production code — it is
  # consumed by `crates/bench/tests/fuzz_parity.rs` against fresh
  # in-memory engines. See `docs/exceptions/fuzz-parity.md`.
  "crates/bench/src/fuzz/",
  "crates/ffi/src/error.rs",
  "crates/ffi/src/lifecycle.rs",
  "crates/ffi/src/snapshot.rs",
  "crates/ffi/src/stmt.rs",
  "crates/ffi/src/util.rs",
  # B1-B5 FFI surface added in 2026-05-17 sqlite3 ABI completion: see
  # docs/exceptions/ffi-unsafe-blocks.md. Each unsafe block in these files
  # carries an exhaustive `// SAFETY:` comment AND a matching `[[entries]]`
  # row in `.jankurai/unsafe-ledger.toml`. Excluded for the same reason as the
  # other `crates/ffi/src/*` rows above (the HLT-029
  # `rust.unsafe.undocumented-block` detector's `NearbySafetyComment`
  # proof-window does not match the workstream's comment style).
  "crates/ffi/src/sqlite3_api/blob.rs",
  "crates/ffi/src/sqlite3_api/collation.rs",
  "crates/ffi/src/sqlite3_api/context.rs",
  "crates/ffi/src/sqlite3_api/hooks.rs",
  "crates/ffi/src/sqlite3_api/hooks_fire.rs",
  "crates/ffi/src/sqlite3_api/mod.rs",
  "crates/ffi/src/sqlite3_api/result.rs",
  "crates/ffi/src/sqlite3_api/udf.rs",
  "crates/ffi/src/sqlite3_api/value.rs",
  # Same exception umbrella as above for the remaining sqlite3_api/* files
  # landed in the B1-B5 workstream: bind / core / exec / meta / stmt also
  # implement the C ABI surface (sqlite3_bind_*, sqlite3_open, sqlite3_exec,
  # sqlite3_db_handle, sqlite3_stmt_readonly, ...) and necessarily contain
  # `unsafe { ... }` blocks that dereference SQLite's documented `*mut sqlite3`
  # / `*mut sqlite3_stmt` pointers. Each block carries the same
  # exhaustive `// SAFETY:` comment + `.jankurai/unsafe-ledger.toml` entry
  # pattern; the HLT-029 detector still does not gate on the proof-window,
  # so the path-level exclusion remains the only documented suppression.
  "crates/ffi/src/sqlite3_api/bind.rs",
  "crates/ffi/src/sqlite3_api/core.rs",
  "crates/ffi/src/sqlite3_api/exec.rs",
  "crates/ffi/src/sqlite3_api/meta.rs",
  "crates/ffi/src/sqlite3_api/stmt.rs",
  "contracts/c-abi/",
  "crates/ffi/include/",
  # SQL trigger runtime: SQLite's trigger specification mandates the
  # row-context names "OLD" and "NEW" verbatim. These names appear as
  # string literals passed to the correlated-row-stack builder and in
  # module-level doc comments explaining the trigger firing protocol.
  # The identifiers cannot be renamed without breaking SQL semantics
  # (user-authored trigger bodies reference OLD.col / NEW.col by name).
  "crates/sql/src/exec/trigger.rs",
  # ATTACH DATABASE: checks the schema name against SQLite's built-in
  # "temp" schema (a system-defined string constant in the SQLite spec).
  # The comparison `lower == "temp"` is a string equality check against
  # a canonical SQLite schema name; it cannot be renamed.
  "crates/sql/src/exec/attach.rs",
  # SQL DDL parser (sqlparser vendor bridge): `AlterTableOperation::RenameColumn`
  # exposes a field named `old_column_name` and `CreateView` exposes
  # `temporary`; both are external crate field names that cannot be renamed
  # without forking the upstream parser crate.
  "crates/sql/src/parser/ddl.rs",
  # CLI .dump command: builds `SELECT * FROM {table}` via format! + quote_ident().
  # SQL table names cannot be passed as parameterized bind values — only
  # data values support prepared-statement parameters. `quote_ident()` provides
  # identifier quoting and escaping; this is the correct sanitization approach
  # for dynamic table names in a CLI dump utility.
  "crates/cli/src/dot/io_cmd.rs",
]
extra_excluded_globs = [
  "contracts/c-abi/**/*.h",
  "crates/ffi/include/**/*.h",
]
