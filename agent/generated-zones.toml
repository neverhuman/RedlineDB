[[zone]]
path = "target/"
source = "Cargo, Jankurai, and local CI lanes"
command = "regenerate from the owning proof lane"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = ".ci-status/"
source = "local CI and split proof lanes"
command = "just required"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = ".jankurai/"
source = "jankurai audit"
command = "just score"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = "authority/source-paths.txt"
source = "immutable source commit cc27936eb45006bda0cae85b0f578f4d5985991d"
command = "cargo run --locked --quiet -- seal-source-inventory --manifest repos.manifest.toml --source-root SOURCE_ROOT --apply"
read_only = false
write_policy = "reviewed_manual"

[[zone]]
path = "target/jankurai/release-candidate-contract.json"
source = "contracts/release-candidate.schema.json"
command = "cargo test --locked release_candidate::tests::published_contract_matches_the_runtime_journal_shape"
read_only = true
write_policy = "auditor_output"

