# NOTE on crates/ffi/include/sqlite3.h: it is a 6-line hand-authored alias
# shim (`#include "../../../contracts/c-abi/redlinedb.h"`), NOT a generated
# file. Per the jankurai rubric, generated-zones is for tool-emitted artifacts
# only; hand-authored files belong in agent/audit-policy.toml's exclusion
# lists (which already cover crates/ffi/include/** via extra_excluded_paths
# and extra_excluded_globs). The Batch A zone entry was an over-application;
# removed here to clear HLT-002-GENERATED-MUTATION (zone file presence check)
# without forcing a synthetic "Generated by:" header onto a 6-line shim.
