[[zone]]
path = "target/"
source = "Cargo, security, and receipt lanes"
command = "regenerate from the owning Justfile lane"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = ".jankurai/"
source = "pinned Jankurai audit"
command = "just score"
read_only = true
write_policy = "auditor_output"

[[zone]]
path = "schemas/"
source = "Rust receipt and lock validators"
command = "cargo test --locked"
read_only = false
write_policy = "reviewed_contract"
