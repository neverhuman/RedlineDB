schema_version = "1.0.0"

# Jankurai tool suite adopted by redline-testing. Each tool is wired into CI
# (.github/workflows/ci.yml) with its command captured in the CI evidence
# catalog and its artifacts uploaded under target/jankurai/**. Run locally via
# `scripts/ci-local.sh jankurai` (ops/ci/jankurai.sh).

[[tools]]
id = "audit-ci"
mode = "auto"

[[tools]]
id = "proof-routing"
mode = "auto"

[[tools]]
id = "proofbind"
mode = "auto"

[[tools]]
id = "proofmark-rust"
mode = "auto"

[[tools]]
id = "copy-code"
mode = "auto"

[[tools]]
id = "security"
mode = "auto"

[[tools]]
id = "ci-bad-behavior"
mode = "auto"

[[tools]]
id = "git-bad-behavior"
mode = "auto"

[[tools]]
id = "release-bad-behavior"
mode = "auto"

[[tools]]
id = "contract-drift"
mode = "auto"

[[tools]]
id = "rust-witness"
mode = "auto"

[[tools]]
id = "authz-matrix"
mode = "auto"

[[tools]]
id = "input-boundary"
mode = "auto"

[[tools]]
id = "agent-tool-supply"
mode = "auto"

[[tools]]
id = "release-readiness"
mode = "auto"

[[tools]]
id = "cost-budget"
mode = "auto"
